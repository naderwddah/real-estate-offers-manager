<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>مسار — تفاصيل العرض</title>
    <link rel="stylesheet" href="global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap");
        * { font-family: "Tajawal", sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0B121E; min-height: 100vh; color: #EDEAE2; }
        
        .bg-surface { background: #121B2C; }
        .bg-surface2 { background: #1A2740; }
        .bg-surface3 { background: #22314C; }
        .bg-bg { background: #0B121E; }
        .text-muted { color: #8B96A8; }
        .text-ink { color: #EDEAE2; }
        .border-line { border-color: rgba(237, 234, 226, 0.08); }
        .bg-gold { background: #C9A24B; }
        .text-gold { color: #C9A24B; }
        .bg-emerald { background: #1F7A5C; }
        .text-emerald { color: #1F7A5C; }
        .bg-danger { background: #E05A4A; }
        .text-danger { color: #E05A4A; }
        
        .btn { padding: 10px 28px; border-radius: 40px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .btn-gold { background: #C9A24B; color: #0B121E; }
        .btn-gold:hover { background: #8A7433; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(201, 162, 75, 0.25); }
        .btn-outline { background: transparent; color: #EDEAE2; border: 2px solid #22314C; }
        .btn-outline:hover { background: #1A2740; color: #EDEAE2; }
        .btn-sm { padding: 6px 16px; font-size: 0.8rem; }
        .btn-emerald { background: #1F7A5C; color: #fff; }
        .btn-emerald:hover { background: #123D30; }
        .btn-danger { background: #E05A4A; color: #fff; }
        .btn-danger:hover { background: #C1543A; }
        
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 30px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.3px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .status-dot.pulse { animation: pulse-dot 1.8s ease-in-out infinite; }
        @keyframes pulse-dot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
        
        .detail-section { background: #121B2C; border-radius: 16px; border: 1px solid rgba(237, 234, 226, 0.08); padding: 20px 24px; margin-bottom: 20px; }
        .detail-section .section-title { font-size: 18px; font-weight: 800; color: #EDEAE2; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
        
        .timeline { display: flex; flex-direction: column; gap: 0; padding-right: 4px; }
        .timeline-item { display: flex; gap: 16px; padding: 6px 0; }
        .timeline-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; border: 2px solid #0B121E; margin-top: 2px; position: relative; z-index: 2; }
        .timeline-dot.completed { background: #C9A24B; }
        .timeline-dot.active { background: #C9A24B; box-shadow: 0 0 0 4px rgba(201, 162, 75, 0.3); }
        .timeline-dot.active.delayed { background: #C1543A; box-shadow: 0 0 0 4px rgba(193, 84, 58, 0.3); }
        .timeline-dot.pending { background: #22314C; }
        .timeline-line { width: 3px; flex: 1; min-height: 24px; margin: 0 7px; border-radius: 4px; }
        .timeline-line.completed { background: linear-gradient(180deg, #C9A24B 0%, #C9A24B 100%); }
        .timeline-line.pending { background: #22314C; }
        .timeline-line.delayed { background: #C1543A; }
        .timeline-content { flex: 1; padding-bottom: 4px; }
        .timeline-content .stage-name { font-weight: 700; font-size: 0.95rem; color: #EDEAE2; }
        .timeline-content .stage-date { font-size: 0.75rem; color: #8B96A8; margin-top: 2px; }
        
        .doc-item { background: #0F1830; border: 1px solid #22314C; border-radius: 8px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; margin: 4px; color: #EDEAE2; }
        .doc-item .del { cursor: pointer; color: #E05A4A; font-weight: 700; font-size: 1rem; }
        .doc-item .del:hover { color: #C1543A; }
        
        .log-entry { padding: 6px 0; border-bottom: 1px solid rgba(237, 234, 226, 0.05); font-size: 0.85rem; color: #8B96A8; display: flex; gap: 8px; flex-wrap: wrap; }
        .log-entry .log-time { color: #5A6A7A; font-size: 0.75rem; white-space: nowrap; min-width: 90px; }
        
        .chip { font-size: 11px; padding: 2px 10px; border-radius: 999px; font-weight: 700; }
        .bg-emeraldSoft { background: #123D30; }
        
        .toast { position: fixed; bottom: 30px; left: 30px; background: #1A2740; color: #EDEAE2; padding: 14px 28px; border-radius: 14px; font-weight: 500; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3); z-index: 9999; display: none; align-items: center; gap: 12px; animation: slideUp 0.3s ease; max-width: 90%; border: 1px solid rgba(237, 234, 226, 0.08); }
        .toast.show { display: flex; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(4, 8, 14, 0.72); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #121B2C; border: 1px solid rgba(237, 234, 226, 0.08); border-radius: 24px; max-width: 860px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 28px 32px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); animation: modalFadeIn 0.25s ease; position: relative; }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-close { position: sticky; top: 0; float: left; background: none; border: none; font-size: 28px; color: #8B96A8; cursor: pointer; transition: color 0.2s; line-height: 1; z-index: 10; }
        .modal-close:hover { color: #EDEAE2; }
        
        .force-action-modal { background: #121B2C; border: 1px solid rgba(237, 234, 226, 0.08); border-radius: 16px; padding: 24px; max-width: 500px; width: 100%; margin: 20px auto; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); animation: modalFadeIn 0.25s ease; }
        .force-action-modal h3 { font-size: 1.2rem; font-weight: 800; color: #EDEAE2; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .force-action-modal p { color: #8B96A8; font-size: 0.95rem; margin-bottom: 16px; }
        .force-action-modal .btn-group { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
        
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 0.85rem; font-weight: 600; color: #8B96A8; }
        .field input, .field select, .field textarea { border: 2px solid #22314C; border-radius: 12px; padding: 10px 14px; font-size: 0.9rem; transition: border 0.2s; background: #0B121E; color: #EDEAE2; width: 100%; font-family: "Tajawal", sans-serif; }
        .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #C9A24B; box-shadow: 0 0 0 3px rgba(201, 162, 75, 0.08); }
        
        .file-upload-area { border: 2px dashed #22314C; border-radius: 12px; padding: 16px; text-align: center; color: #8B96A8; cursor: pointer; transition: background 0.2s, border-color 0.2s; font-weight: 500; font-size: 0.9rem; }
        .file-upload-area:hover { background: #0F1830; border-color: #C9A24B; }
        
        .main-content { display: none; }
        .main-content.visible { display: block; }
        
        #loginOverlay { position: fixed; inset: 0; background: rgba(4, 8, 14, 0.85); display: none !important; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(4px); }
        #loginOverlay.show { display: flex !important; }
        .login-box { background: #121B2C; border: 1px solid rgba(237, 234, 226, 0.08); padding: 40px 30px; border-radius: 24px; max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .login-box h2 { color: #EDEAE2; font-weight: 800; text-align: center; margin-bottom: 24px; }
        .login-box .field { margin-bottom: 16px; }
        .login-box .field label { font-size: 0.85rem; font-weight: 600; color: #8B96A8; }
        .login-box .field input { border: 2px solid #22314C; border-radius: 12px; padding: 10px 14px; font-size: 0.9rem; transition: border 0.2s; background: #0B121E; color: #EDEAE2; width: 100%; font-family: "Tajawal", sans-serif; }
        .login-box .field input:focus { outline: none; border-color: #C9A24B; }
        .login-box .btn { width: 100%; justify-content: center; }
        #loginError { color: #E05A4A; font-size: 0.85rem; text-align: center; margin-top: 8px; display: none; }
        
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 768px) { .detail-section { padding: 14px 16px; } .btn { padding: 8px 18px; font-size: 0.85rem; } .modal-box { padding: 16px; } }
    </style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
    <div class="login-box">
        <h2><i class="fas fa-lock ml-2"></i>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" value="admin@masar.sa" required /></div>
            <div class="field"><label>كلمة المرور</label><input type="password" id="loginPassword" value="Admin.123" required /></div>
            <div id="loginError">خطأ في بيانات الدخول</div>
            <button type="submit" class="btn btn-gold mt-2"><i class="fas fa-sign-in-alt"></i> دخول</button>
        </form>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle text-emerald-400"></i>
    <span id="toastMessage">تم الإجراء بنجاح</span>
</div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<!-- MAIN CONTENT -->
<div class="main-content" id="mainContent">
    <div class="max-w-5xl mx-auto px-3 sm:px-5 lg:px-8 py-5 md:py-8">
        <!-- Back Button -->
        <button class="btn btn-outline btn-sm mb-4" onclick="goBack()">
            <i class="fas fa-arrow-right ml-1"></i> رجوع للقائمة
        </button>
        
        <!-- Loading -->
        <div id="loadingState" class="text-center py-12">
            <div class="spinner mx-auto"></div>
            <p class="text-muted mt-4">جاري تحميل تفاصيل العرض...</p>
        </div>
        
        <!-- Detail Content -->
        <div id="detailContent" style="display:none;"></div>
    </div>
</div>

<!-- ===== FORCE ACTION MODAL ===== -->
<div class="modal-overlay" id="forceActionModal">
    <div class="force-action-modal">
        <button class="modal-close" onclick="closeModal('forceActionModal')" style="position:relative;float:left;background:none;border:none;font-size:28px;color:#8B96A8;cursor:pointer;">✕</button>
        <h3 id="forceActionTitle">📢 إجراء مطلوب</h3>
        <p id="forceActionMessage">يرجى تنفيذ الخطوة التالية لإكمال العملية.</p>
        <div id="forceActionBody"></div>
        <div class="btn-group">
            <button class="btn btn-outline btn-sm" onclick="closeModal('forceActionModal')">تأجيل</button>
            <button class="btn btn-gold btn-sm" id="forceActionPrimaryBtn" onclick="executeForceAction()">تأكيد</button>
        </div>
    </div>
</div>

<!-- ===== RECORD PRICE MODAL ===== -->
<div class="modal-overlay" id="recordPriceModal">
    <div class="modal-box" style="max-width:500px;">
        <button class="modal-close" onclick="closeModal('recordPriceModal')">✕</button>
        <div class="modal-title">💰 تسجيل السعر المعتمد</div>
        <form onsubmit="recordPriceSubmit(event)">
            <input type="hidden" id="recordPriceOfferId">
            <div class="field mb-4">
                <label>السعر السابق (ريال)</label>
                <input type="number" id="forceOldPrice" readonly style="background:#0B121E;color:#8B96A8;" />
            </div>
            <div class="field mb-4">
                <label>السعر المعتمد الجديد (ريال) *</label>
                <input type="number" id="forcePriceInput" required placeholder="أدخل السعر..." />
            </div>
            <div class="field mb-4">
                <label>ملاحظات المدير</label>
                <textarea id="forcePriceNotes" rows="2" placeholder="أي ملاحظات إضافية..."></textarea>
            </div>
            <div style="margin-top:12px;background:#0F1830;border:1px solid #1F7A5C;border-radius:12px;padding:12px;">
                <p style="font-size:0.9rem;color:#1F7A5C;"><i class="fas fa-clock ml-1"></i> بعد الحفظ، سيتم فتح واتساب لإبلاغ العميل بالسعر الجديد.</p>
            </div>
            <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap">
                <button type="button" class="btn btn-outline" onclick="closeModal('recordPriceModal')">إلغاء</button>
                <button type="submit" class="btn btn-gold">💰 تسجيل السعر</button>
            </div>
        </form>
    </div>
</div>

<script src="sidebar.js"></script>
<script src="api.js"></script>
<script src="global.js"></script>
<script>
// ============================================================
// OFFER DETAIL - صفحة تفاصيل العرض المستقلة
// ============================================================

let currentOfferId = null;
let isAuthChecked = false;
let forceActionData = { offerId: null, action: null, files: [] };
let currentStageAction = null;

// ============================================================
// AUTH
// ============================================================
async function checkAuth() {
    if (isAuthChecked && API.isAuthenticated()) {
        return true;
    }

    const token = localStorage.getItem('masar_token');
    const overlay = document.getElementById('loginOverlay');
    const mainContent = document.getElementById('mainContent');

    if (token) {
        try {
            const result = await API.auth.me();
            if (result.status === 'success') {
                API.token = token;
                overlay.classList.remove('show');
                mainContent.classList.add('visible');
                isAuthChecked = true;
                return true;
            } else {
                localStorage.removeItem('masar_token');
                localStorage.removeItem('masar_user');
                API.token = null;
            }
        } catch (err) {
            console.warn('خطأ في التحقق من التوكن:', err.message);
            localStorage.removeItem('masar_token');
            localStorage.removeItem('masar_user');
            API.token = null;
        }
    }

    overlay.classList.add('show');
    mainContent.classList.remove('visible');
    isAuthChecked = false;
    return false;
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    const submitBtn = this.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> جاري الدخول...';

    try {
        const result = await API.auth.login(email, password);
        if (result.status === 'success') {
            errorEl.style.display = 'none';
            if (result.data?.user) {
                localStorage.setItem('masar_user', JSON.stringify(result.data.user));
            }
            const isAuth = await checkAuth();
            if (isAuth) {
                showToast('✅ تم تسجيل الدخول بنجاح', 'success');
                loadOfferDetail();
            }
        } else {
            errorEl.textContent = result.message || 'فشل تسجيل الدخول';
            errorEl.style.display = 'block';
        }
    } catch (err) {
        errorEl.textContent = err.message || 'حدث خطأ في الاتصال';
        errorEl.style.display = 'block';
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
    }
});

// ============================================================
// HELPERS
// ============================================================
function getStageName(id, track) {
    const stages = track === 'company' ? [
        { id: 1, name: 'عرض جديد (استلام)' },
        { id: 2, name: 'بانتظار تسعير المدير' },
        { id: 3, name: 'تم تحديد السعر' },
        { id: 4, name: 'بانتظار مستندات العميل' },
        { id: 5, name: 'تم استلام المستندات' },
        { id: 6, name: 'بانتظار مراجعة قانونية' },
        { id: 7, name: 'تم اعتماد العقد قانونياً' },
        { id: 8, name: 'بانتظار توقيع العميل' },
        { id: 9, name: 'تم توقيع العميل' },
        { id: 10, name: '✅ مكتمل' },
        { id: 11, name: 'بانتظار العميل' }
    ] : [
        { id: 1, name: 'عرض جديد' },
        { id: 2, name: 'تفاوض' },
        { id: 3, name: 'تم الاتفاق' },
        { id: 4, name: 'مكتمل ✅' }
    ];
    const s = stages.find(s => s.id === id);
    return s ? s.name : 'غير معروف';
}

function getStatusInfo(id) {
    const map = {
        1: { label: 'جديد', color: '#f97316', statusType: 'جديد' },
        2: { label: 'انتظار تسعير', color: '#f59e0b', statusType: 'انتظار' },
        3: { label: 'تم التسعير', color: '#3b82f6', statusType: 'قيد' },
        4: { label: 'انتظار مستندات', color: '#f59e0b', statusType: 'انتظار' },
        5: { label: 'استلم المستندات', color: '#3b82f6', statusType: 'قيد' },
        6: { label: 'مراجعة قانونية', color: '#f59e0b', statusType: 'انتظار' },
        7: { label: 'اعتماد قانوني', color: '#3b82f6', statusType: 'قيد' },
        8: { label: 'انتظار توقيع', color: '#f59e0b', statusType: 'انتظار' },
        9: { label: 'تم التوقيع', color: '#3b82f6', statusType: 'قيد' },
        10: { label: 'مكتمل ✅', color: '#10b981', statusType: 'مغلق' },
        11: { label: 'بانتظار العميل', color: '#f59e0b', statusType: 'انتظار' }
    };
    return map[id] || { label: 'غير معروف', color: '#9ca3af', statusType: 'other' };
}

function formatDate(d) {
    if (!d) return '-';
    try {
        const date = new Date(d);
        return date.toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
    } catch (e) {
        return d;
    }
}

function formatMoney(n) {
    return n ? Number(n).toLocaleString('en-US') + ' ريال' : '—';
}

function daysBetween(a, b) {
    return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function goBack() {
    window.history.back();
}

// ============================================================
// LOAD OFFER DETAIL
// ============================================================
async function loadOfferDetail() {
    if (!API.isAuthenticated()) {
        await checkAuth();
        return;
    }

    // الحصول على ID من URL
    const params = new URLSearchParams(window.location.search);
    const offerId = params.get('id');
    
    if (!offerId) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('detailContent').style.display = 'block';
        document.getElementById('detailContent').innerHTML = `
            <div class="text-center py-12 text-muted">
                <i class="fas fa-exclamation-circle text-4xl block mb-4"></i>
                <p>لم يتم تحديد رقم العرض</p>
                <button class="btn btn-gold mt-4" onclick="goBack()">العودة للقائمة</button>
            </div>
        `;
        return;
    }

    currentOfferId = offerId;

    try {
        const result = await API.offers.get(offerId);
        
        if (result.status === 'success') {
            const offer = result.data;
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('detailContent').style.display = 'block';
            renderOfferDetail(offer);
        } else {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('detailContent').style.display = 'block';
            document.getElementById('detailContent').innerHTML = `
                <div class="text-center py-12 text-muted">
                    <i class="fas fa-exclamation-circle text-4xl block mb-4"></i>
                    <p>${result.message || 'العرض غير موجود'}</p>
                    <button class="btn btn-gold mt-4" onclick="goBack()">العودة للقائمة</button>
                </div>
            `;
        }
    } catch (err) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('detailContent').style.display = 'block';
        document.getElementById('detailContent').innerHTML = `
            <div class="text-center py-12 text-muted">
                <i class="fas fa-exclamation-triangle text-4xl block mb-4"></i>
                <p>حدث خطأ في تحميل البيانات: ${err.message}</p>
                <button class="btn btn-gold mt-4" onclick="loadOfferDetail()">🔄 إعادة المحاولة</button>
            </div>
        `;
    }
}

// ============================================================
// RENDER OFFER DETAIL
// ============================================================
function renderOfferDetail(o) {
    const stages = o.track_type === 'company' ? [
        { id: 1, name: 'عرض جديد (استلام)' },
        { id: 2, name: 'بانتظار تسعير المدير' },
        { id: 3, name: 'تم تحديد السعر' },
        { id: 4, name: 'بانتظار مستندات العميل' },
        { id: 5, name: 'تم استلام المستندات' },
        { id: 6, name: 'بانتظار مراجعة قانونية' },
        { id: 7, name: 'تم اعتماد العقد قانونياً' },
        { id: 8, name: 'بانتظار توقيع العميل' },
        { id: 9, name: 'تم توقيع العميل' },
        { id: 10, name: '✅ مكتمل' },
        { id: 11, name: 'بانتظار العميل' }
    ] : [
        { id: 1, name: 'عرض جديد' },
        { id: 2, name: 'تفاوض' },
        { id: 3, name: 'تم الاتفاق' },
        { id: 4, name: 'مكتمل ✅' }
    ];

    const st = getStatusInfo(o.stage_id);
    const stageName = getStageName(o.stage_id, o.track_type);
    const isComplete = o.stage_id === 10 || (o.track_type === 'personal' && o.stage_id === 4);
    const isDelayed = [2, 4, 6, 8, 11].includes(o.stage_id);
    
    const maxWait = 3;
    const isOverdue = o.stage_id > 1 && o.stage_id < stages.length && 
                      daysBetween(o.status_date || o.created_at, new Date().toISOString().slice(0, 10)) >= maxWait;

    // Timeline
    let timelineHtml = stages.map((s, idx) => {
        const isCompleted = idx < o.stage_id;
        const isActive = idx === o.stage_id - 1;
        let dotClass = 'pending';
        let lineClass = 'pending';
        if (isCompleted) {
            dotClass = 'completed';
            lineClass = 'completed';
        } else if (isActive) {
            dotClass = isOverdue ? 'delayed' : 'active';
            lineClass = isOverdue ? 'delayed' : 'pending';
        }
        return `
            <div class="timeline-item">
                <div style="display:flex;flex-direction:column;align-items:center;padding-top:2px">
                    <div class="timeline-dot ${dotClass}"></div>
                    ${idx < stages.length - 1 ? `<div class="timeline-line ${lineClass}"></div>` : ''}

                <div class="timeline-content">
                    <div class="stage-name">${s.name}</div>
                    ${isActive ? `<div class="stage-date">🔵 المرحلة الحالية</div>` : ''}
                    ${isCompleted && idx === o.stage_id - 1 ? `<div class="stage-date">✅ تم الإنجاز</div>` : ''}
                </div>
            </div>
        `;
    }).join('');

    // Documents
    let docsHtml = '';
    const docNames = Object.keys(o.documents || {});
    if (docNames.length) {
        docsHtml = docNames.map(d => `
            <span class="doc-item">
                ${d} ${o.documents[d] ? '✅' : '⏳'}

            </span>
        `).join('');
    } else {
        docsHtml = '<span style="color:#8B96A8;">لا توجد مستندات</span>';
    }

    // Log
    let logHtml = (o.log || []).map(l => `
        <div class="log-entry">
            <span class="log-time">${l.slice(0, 16)}</span>
            <span>${l.slice(16)}</span>

    `).join('') || '<div style="color:#8B96A8;">لا توجد سجلات</div>';

    // Action buttons
    let actionsHtml = '';
    if (!isComplete) {
        if (o.track_type === 'company' && o.stage_id === 11) {
            actionsHtml += `<button class="btn btn-gold btn-sm" onclick="completeCompanyOffer('${o.id}')">✅ إكمال الصفقة</button>`;

        } else if (o.stage_id === 2) {
            actionsHtml += `<button class="btn btn-gold btn-sm" onclick="showForceAction('${o.id}','record_price','يرجى إدخال السعر المعتمد من المدير.')">💰 تسجيل السعر</button>`;
        } else if (o.stage_id === 3) {
            actionsHtml += `<button class="btn btn-gold btn-sm" onclick="showForceAction('${o.id}','receive_docs','قم بتأكيد استلام المستندات من العميل.')">📄 استلام المستندات</button>`;
        } else if (o.stage_id === 4) {
            actionsHtml += `<button class="btn btn-gold btn-sm" onclick="showForceAction('${o.id}','receive_docs','تم استلام المستندات؟ قم برفعها.')">📄 استلام المستندات</button>`;
        } else if (o.stage_id === 5) {
            actionsHtml += `<button class="btn btn-gold btn-sm" onclick="showForceAction('${o.id}','send_to_legal','قم بإرسال المستندات للشؤون القانونية.')">⚖️ إرسال للقانونية</button>`;
        } else if (o.stage_id === 6) {
            actionsHtml += `<button class="btn btn-gold btn-sm" onclick="showForceAction('${o.id}','legal_approved','تم اعتماد العقد؟ قم برفعه وإرساله للعميل.')">📄 اعتماد قانوني</button>`;
        } else if (o.stage_id === 7) {
            actionsHtml += `<button class="btn btn-gold btn-sm" onclick="showForceAction('${o.id}','legal_approved','قم برفع العقد النهائي وإرساله للعميل.')">📤 إرسال العقد للعميل</button>`;
        } else if (o.stage_id === 8) {
            actionsHtml += `<button class="btn btn-gold btn-sm" onclick="showForceAction('${o.id}','client_signed','تم توقيع العميل؟ قم برفع العقد الموقع.')">📝 توقيع العميل</button>`;
        } else if (o.stage_id === 9) {

        }
        actionsHtml += `<button class="btn btn-outline btn-sm" onclick="openEditOffer('${o.id}')"><i class="fas fa-pen"></i> تعديل</button>`;
        if (o.stage_id > 1) {
            actionsHtml += `<button class="btn btn-outline btn-sm" onclick="regressStage('${o.id}')"><i class="fas fa-undo"></i> رجوع</button>`;

    const fullAddress = (o.city || '') + ' - ' + (o.district || '');

    const html = `

                    <div><span class="text-sm text-muted">النوع</span><div class="text-ink">${o.provider_type || o.contact?.contact_type || '-'}</div></div>
                    <div><span class="text-sm text-muted">رقم الجوال</span><div class="text-ink">${o.contact_phone || o.contact?.phone || '-'}</div></div>
                </div>
            </div>
        </div>

        <div class="detail-section">
            <div class="section-title"><i class="fas fa-route text-gold"></i> مسار الصفقة</div>
            <div class="timeline">${timelineHtml}</div>

// ============================================================
// ACTIONS
// ============================================================
function openEditOffer(id) {
    window.location.href = `offers.html?edit=${id}`;
}

function toggleDoc(id, docName) {
    // سيتم تنفيذها عبر API
    showToast('جاري تحديث المستند...', 'info');
}

function addDocument(id) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.pdf,.jpg,.jpeg,.png,.doc,.docx';
    input.onchange = async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const docType = prompt('نوع المستند (صورة/مخطط/صك/وكالة/عقد/سجل تجاري/ترخيص/أخرى):', 'صورة');
        if (!docType) return;
        
        try {
            const result = await API.attachments.uploadOffer(id, file, docType);
            if (result.status === 'success') {
                showToast('✅ تم رفع المستند', 'success');
                loadOfferDetail();
            } else {
                showToast(result.message || 'فشل رفع المستند', 'error');
            }
        } catch (err) {
            showToast(err.message || 'حدث خطأ', 'error');
        }
    };
    input.click();
}

function regressStage(id) {
    const stageId = prompt('أدخل رقم المرحلة الجديدة (1-11):', '1');
    if (!stageId) return;
    
    const newStage = parseInt(stageId);
    if (isNaN(newStage) || newStage < 1 || newStage > 11) {
        showToast('مرحلة غير صالحة', 'error');
        return;
    }
    
    API.offers.changeStage(id, newStage, 'تم الرجوع للمرحلة بواسطة المستخدم')
        .then(result => {
            if (result.status === 'success') {
                showToast('✅ تم تغيير المرحلة', 'success');
                loadOfferDetail();
            } else {
                showToast(result.message || 'فشل تغيير المرحلة', 'error');
            }
        })
        .catch(err => {
            showToast(err.message || 'حدث خطأ', 'error');
        });
}

function completeCompanyOffer(id) {
    if (!confirm('هل أنت متأكد من إكمال الصفقة؟')) return;
    
    API.offers.changeStage(id, 10, 'تم إكمال الصفقة')
        .then(result => {
            if (result.status === 'success') {
                showToast('🎉 تم إكمال الصفقة بنجاح!', 'success');
                loadOfferDetail();
            } else {
                showToast(result.message || 'فشل إكمال الصفقة', 'error');
            }
        })
        .catch(err => {
            showToast(err.message || 'حدث خطأ', 'error');
        });
}

function forceActionFilesSelected(input) {
    const files = input.files;
    const list = document.getElementById('forceFileList');
    if (!list) return;
    let html = '';
    for (let i = 0; i < files.length; i++) {
        html += `<div style="display:inline-block;background:#0F1830;border:1px solid #22314C;border-radius:6px;padding:4px 12px;margin:4px;font-size:0.8rem;color:#EDEAE2;">
            📎 ${files[i].name}
        </div>`;
        forceActionData.files.push(files[i]);
    }
    list.innerHTML = html;
}

function executeForceAction() {
    const offerId = forceActionData.offerId;
    const action = forceActionData.action;

    switch (action) {
        case 'send_to_manager':
            API.offers.changeStage(offerId, 2, 'تم إرسال العرض للمدير')
                .then(result => {
                    if (result.status === 'success') {
                        showToast('📤 تم إرسال العرض للمدير', 'success');
                        closeModal('forceActionModal');
                        loadOfferDetail();
                    } else {
                        showToast(result.message || 'فشل الإرسال', 'error');
                    }
                })
                .catch(err => {
                    showToast(err.message || 'حدث خطأ', 'error');
                });
            break;

        case 'record_price':
            // يتم التعامل معها في recordPriceSubmit
            break;

        case 'receive_docs':
            API.offers.changeStage(offerId, 5, 'تم استلام المستندات من العميل')
                .then(result => {
                    if (result.status === 'success') {
                        showToast('✅ تم استلام المستندات', 'success');
                        closeModal('forceActionModal');
                        loadOfferDetail();
                    } else {
                        showToast(result.message || 'فشل التأكيد', 'error');

                .catch(err => {
                    showToast(err.message || 'حدث خطأ', 'error');
                });
            break;

        case 'send_to_legal':
            API.offers.changeStage(offerId, 6, 'تم إرسال المستندات للشؤون القانونية')

                    if (result.status === 'success') {
                        showToast('📤 تم إرسال المستندات للشؤون القانونية', 'success');

                        loadOfferDetail();

                        showToast(result.message || 'فشل الإرسال', 'error');
                    }
                })
                .catch(err => {
                    showToast(err.message || 'حدث خطأ', 'error');
                });
            break;

        case 'legal_approved':
            API.offers.changeStage(offerId, 7, 'تم اعتماد العقد من الشؤون القانونية')
                .then(result => {
                    if (result.status === 'success') {
                        showToast('✅ تم اعتماد العقد', 'success');
                        closeModal('forceActionModal');
                        loadOfferDetail();
                    } else {
                        showToast(result.message || 'فشل الاعتماد', 'error');
                    }
                })
                .catch(err => {
                    showToast(err.message || 'حدث خطأ', 'error');
                });
            break;

        case 'client_signed':
            API.offers.changeStage(offerId, 10, 'تم توقيع العميل على العقد')
                .then(result => {
                    if (result.status === 'success') {
                        showToast('🎉 تم إتمام الصفقة!', 'success');
                        closeModal('forceActionModal');
                        loadOfferDetail();
                    } else {
                        showToast(result.message || 'فشل التأكيد', 'error');
                    }
                })
                .catch(err => {
                    showToast(err.message || 'حدث خطأ', 'error');
                });
            break;

        default:
            showToast('إجراء غير معروف', 'error');
            closeModal('forceActionModal');
    }
}

function recordPriceSubmit(e) {
    e.preventDefault();
    const offerId = document.getElementById('recordPriceOfferId').value;
    const price = document.getElementById('forcePriceInput').value;
    const notes = document.getElementById('forcePriceNotes').value;

    if (!price || Number(price) <= 0) {
        showToast('الرجاء إدخال سعر صحيح', 'error');
        return;
    }

    // تحديث السعر ثم تغيير المرحلة
    API.offers.update(offerId, { price: Number(price) })
        .then(result => {
            if (result.status === 'success') {
                return API.offers.changeStage(offerId, 3, `تم تحديد السعر المعتمد: ${formatMoney(price)} - ملاحظات: ${notes || 'بدون'}`);
            } else {
                throw new Error(result.message || 'فشل تحديث السعر');
            }
        })
        .then(result => {
            if (result.status === 'success') {
                showToast(`✅ تم تسجيل السعر: ${formatMoney(price)}`, 'success');
                closeModal('recordPriceModal');
                loadOfferDetail();
            } else {
                showToast(result.message || 'فشل تغيير المرحلة', 'error');
            }
        })
        .catch(err => {
            showToast(err.message || 'حدث خطأ', 'error');
        });
}

// ============================================================
// MODAL CONTROLS
// ============================================================
function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async function() {
    const isAuth = await checkAuth();
    if (isAuth) {
        loadOfferDetail();
    }
});

// ============================================================
// EXPOSE GLOBALS
// ============================================================
window.goBack = goBack;
window.showToast = showToast;
window.closeModal = closeModal;
window.executeForceAction = executeForceAction;
window.forceActionFilesSelected = forceActionFilesSelected;
window.recordPriceSubmit = recordPriceSubmit;
window.loadOfferDetail = loadOfferDetail;
window.showForceAction = showForceAction;
window.toggleDoc = toggleDoc;
window.addDocument = addDocument;
window.regressStage = regressStage;
window.completeCompanyOffer = completeCompanyOffer;
window.openEditOffer = openEditOffer;
</script>
