<header class="app-header">
    <div class="left-section">
        <button class="toggle-sidebar-btn" id="toggleSidebarBtn" aria-label="فتح القائمة">
            <i class="fas fa-bars"></i>
        </button>
        <div class="brand">
            عقاري <span>CRM</span>
        </div>
    </div>

    <div class="right-section">
        <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>

        <button class="relative" style="background:none;border:none;cursor:pointer;padding:8px;border-radius:12px;transition:all 0.3s;color:var(--text-secondary);" onmouseover="this.style.color='var(--gold-primary)'" onmouseout="this.style.color='var(--text-secondary)'" aria-label="الإشعارات">
            <i class="fas fa-bell text-lg"></i>
            <span style="position:absolute;top:-2px;right:-2px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(239,68,68,0.4);">3</span>
        </button>
    </div>
</header>
