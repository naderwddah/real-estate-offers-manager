<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>مسار — التنبيهات والتذكيرات</title>
    <link rel="stylesheet" href="global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap");
        * { font-family: "Tajawal", sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0B121E; min-height: 100vh; color: #EDEAE2; }
        
        /* ===== تنسيقات الواجهة المظلمة ===== */
        .bg-surface { background: #121B2C; }
        .bg-surface2 { background: #1A2740; }
        .bg-surface3 { background: #22314C; }
        .bg-bg { background: #0B121E; }
        .text-muted { color: #8B96A8; }
        .text-ink { color: #EDEAE2; }
        .border-line { border-color: rgba(237, 234, 226, 0.08); }
        .bg-gold { background: #C9A24B; }
        .text-gold { color: #C9A24B; }
        .bg-emerald { background: #1F7A5C; }
        .text-emerald { color: #1F7A5C; }
        .bg-terracotta { background: #C1543A; }
        .text-terracotta { color: #C1543A; }
        .bg-danger { background: #E05A4A; }
        .text-danger { color: #E05A4A; }
        
        .stat-card { transition: all 0.25s ease; border: 1px solid rgba(237, 234, 226, 0.08); cursor: pointer; background: #121B2C; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3); }
        .stat-card .stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        
        .btn { padding: 10px 28px; border-radius: 40px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .btn-gold { background: #C9A24B; color: #0B121E; }
        .btn-gold:hover { background: #8A7433; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(201, 162, 75, 0.25); }
        .btn-outline { background: transparent; color: #EDEAE2; border: 2px solid #22314C; }
        .btn-outline:hover { background: #1A2740; color: #EDEAE2; }
        .btn-sm { padding: 6px 16px; font-size: 0.8rem; }
        .btn-danger { background: #E05A4A; color: #fff; }
        .btn-danger:hover { background: #C1543A; }
        
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 30px; font-size: 0.78rem; font-weight: 600; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(4, 8, 14, 0.72); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #121B2C; border: 1px solid rgba(237, 234, 226, 0.08); border-radius: 24px; max-width: 600px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 28px 32px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); animation: modalFadeIn 0.25s ease; position: relative; }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-close { position: sticky; top: 0; float: left; background: none; border: none; font-size: 28px; color: #8B96A8; cursor: pointer; transition: color 0.2s; line-height: 1; z-index: 10; }
        .modal-close:hover { color: #EDEAE2; }
        .modal-title { font-size: 24px; font-weight: 800; color: #EDEAE2; margin-bottom: 20px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 0.85rem; font-weight: 600; color: #8B96A8; }
        .field input, .field select, .field textarea { border: 2px solid #22314C; border-radius: 12px; padding: 10px 14px; font-size: 0.9rem; transition: border 0.2s; background: #0B121E; color: #EDEAE2; width: 100%; font-family: "Tajawal", sans-serif; }
        .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #C9A24B; box-shadow: 0 0 0 3px rgba(201, 162, 75, 0.08); }
        .field input::placeholder, .field textarea::placeholder { color: #5A6A7A; }
        .field.full-width { grid-column: 1 / -1; }
        
        .toast { position: fixed; bottom: 30px; left: 30px; background: #1A2740; color: #EDEAE2; padding: 14px 28px; border-radius: 14px; font-weight: 500; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3); z-index: 9999; display: none; align-items: center; gap: 12px; animation: slideUp 0.3s ease; max-width: 90%; border: 1px solid rgba(237, 234, 226, 0.08); }
        .toast.show { display: flex; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .notif-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(237, 234, 226, 0.08); background: #121B2C; transition: all 0.2s; margin-bottom: 8px; }
        .notif-item:hover { border-color: #C9A24B55; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
        .notif-item.unread { border-right: 4px solid #C9A24B; background: #1A2740; }
        .notif-item .notif-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 2px; }
        .notif-item .notif-content { flex: 1; }
        .notif-item .notif-title { font-weight: 700; font-size: 0.95rem; color: #EDEAE2; }
        .notif-item .notif-message { font-size: 0.85rem; color: #8B96A8; margin-top: 2px; }
        .notif-item .notif-time { font-size: 0.7rem; color: #5A6A7A; margin-top: 4px; }
        .notif-item .notif-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .notif-item .notif-actions button { background: none; border: none; cursor: pointer; color: #8B96A8; transition: color 0.2s; font-size: 0.9rem; padding: 4px 6px; }
        .notif-item .notif-actions button:hover { color: #C9A24B; }
        .notif-item .notif-actions button.danger:hover { color: #E05A4A; }
        
        .reminder-item { padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(237, 234, 226, 0.08); background: #121B2C; margin-bottom: 8px; transition: all 0.2s; }
        .reminder-item:hover { border-color: #C9A24B55; }
        .reminder-item.done { opacity: 0.5; background: #0F1830; }
        .reminder-item .reminder-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; }
        .reminder-item .reminder-title { font-weight: 700; font-size: 0.95rem; color: #EDEAE2; }
        .reminder-item .reminder-date { font-size: 0.75rem; color: #8B96A8; }
        .reminder-item .reminder-notes { font-size: 0.85rem; color: #8B96A8; margin-top: 4px; }
        .reminder-item .reminder-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .reminder-item .reminder-actions button { padding: 2px 12px; border-radius: 20px; border: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .reminder-item .reminder-actions .done-btn { background: #1F7A5C; color: #fff; }
        .reminder-item .reminder-actions .done-btn:hover { background: #123D30; }
        .reminder-item .reminder-actions .edit-btn { background: #1A2740; color: #EDEAE2; }
        .reminder-item .reminder-actions .edit-btn:hover { background: #22314C; }
        .reminder-item .reminder-actions .delete-btn { background: #3A1A14; color: #E05A4A; }
        .reminder-item .reminder-actions .delete-btn:hover { background: #3A1E19; }
        
        .tab-btn { padding: 8px 20px; border: none; border-radius: 30px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; background: transparent; color: #8B96A8; }
        .tab-btn.active { background: #C9A24B; color: #0B121E; box-shadow: 0 4px 12px rgba(201, 162, 75, 0.25); }
        .tab-btn:hover:not(.active) { background: #1A2740; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .filter-btn { padding: 4px 14px; border-radius: 20px; border: 1px solid #22314C; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; background: transparent; color: #8B96A8; }
        .filter-btn.active { background: #C9A24B; color: #0B121E; border-color: #C9A24B; }
        .filter-btn:hover:not(.active) { background: #1A2740; }
        
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } .modal-box { padding: 16px; } }
        
        /* ===== شاشة الدخول ===== */
        #loginOverlay { position: fixed; inset: 0; background: rgba(4, 8, 14, 0.85); display: none !important; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(4px); }
        #loginOverlay.show { display: flex !important; }
        .login-box { background: #121B2C; border: 1px solid rgba(237, 234, 226, 0.08); padding: 40px 30px; border-radius: 24px; max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .login-box h2 { color: #EDEAE2; font-weight: 800; text-align: center; margin-bottom: 24px; }
        .login-box .field { margin-bottom: 16px; }
        .login-box .field label { font-size: 0.85rem; font-weight: 600; color: #8B96A8; }
        .login-box .field input { border: 2px solid #22314C; border-radius: 12px; padding: 10px 14px; font-size: 0.9rem; transition: border 0.2s; background: #0B121E; color: #EDEAE2; width: 100%; font-family: "Tajawal", sans-serif; }
        .login-box .field input:focus { outline: none; border-color: #C9A24B; }
        .login-box .btn { width: 100%; justify-content: center; }
        #loginError { color: #E05A4A; font-size: 0.85rem; text-align: center; margin-top: 8px; display: none; }
        
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .main-content { display: none !important; }
        .main-content.visible { display: block !important; }
    </style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
    <div class="login-box">
        <h2><i class="fas fa-lock ml-2"></i>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" value="admin@masar.sa" required /></div>
            <div class="field"><label>كلمة المرور</label><input type="password" id="loginPassword" value="Admin.123" required /></div>
            <div id="loginError">خطأ في بيانات الدخول</div>
            <button type="submit" class="btn btn-gold mt-2"><i class="fas fa-sign-in-alt"></i> دخول</button>
        </form>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle text-emerald-400"></i>
    <span id="toastMessage">تم الإجراء بنجاح</span>
</div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<!-- MAIN CONTENT -->
<div class="main-content" id="mainContent">
    <div class="max-w-6xl mx-auto px-3 sm:px-5 lg:px-8 py-5 md:py-8">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-gold tracking-tight">
                    <i class="fas fa-bell ml-2 text-gold"></i>التنبيهات والتذكيرات
                </h1>
                <p class="text-sm text-muted mt-1">إدارة جميع الإشعارات والتذكيرات في مكان واحد</p>
            </div>
            <button onclick="openAddReminder()" class="btn btn-gold text-sm"><i class="fas fa-plus"></i> إضافة تذكير جديد</button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="statsGrid">
            <div class="stat-card rounded-xl px-3 py-3 md:py-4 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="stat-icon bg-blue-50/10 text-blue-400"><i class="fas fa-bell"></i></div>
                    <div><p class="text-xs text-muted font-medium">إجمالي الإشعارات</p><p class="text-xl md:text-2xl font-bold text-gold" id="totalNotifications">0</p></div>
                </div>
            </div>
            <div class="stat-card rounded-xl px-3 py-3 md:py-4 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="stat-icon bg-amber-50/10 text-amber-400"><i class="fas fa-circle"></i></div>
                    <div><p class="text-xs text-muted font-medium">غير مقروءة</p><p class="text-xl md:text-2xl font-bold text-amber-400" id="unreadNotifications">0</p></div>
                </div>
            </div>
            <div class="stat-card rounded-xl px-3 py-3 md:py-4 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="stat-icon bg-emerald-50/10 text-emerald-400"><i class="fas fa-clock"></i></div>
                    <div><p class="text-xs text-muted font-medium">التذكيرات</p><p class="text-xl md:text-2xl font-bold text-emerald-400" id="totalReminders">0</p></div>
                </div>
            </div>
            <div class="stat-card rounded-xl px-3 py-3 md:py-4 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="stat-icon bg-red-50/10 text-red-400"><i class="fas fa-exclamation-triangle"></i></div>
                    <div><p class="text-xs text-muted font-medium">متأخرة</p><p class="text-xl md:text-2xl font-bold text-red-400" id="overdueReminders">0</p></div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex flex-wrap gap-2 mb-4">
            <button class="tab-btn active" data-tab="notifications" onclick="switchTab('notifications')"><i class="fas fa-bell ml-1"></i> الإشعارات <span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full mr-1" id="notifBadge">0</span></button>
            <button class="tab-btn" data-tab="reminders" onclick="switchTab('reminders')"><i class="fas fa-clock ml-1"></i> التذكيرات <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full mr-1" id="reminderBadge">0</span></button>
        </div>

        <!-- Notifications Tab -->
        <div id="tab-notifications" class="tab-content active">
            <div class="bg-surface rounded-2xl border border-line p-4 md:p-5">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div class="flex flex-wrap gap-2">
                        <button class="filter-btn active" data-filter="all" onclick="filterNotifications('all')">الكل</button>
                        <button class="filter-btn" data-filter="unread" onclick="filterNotifications('unread')">غير مقروءة</button>
                        <button class="filter-btn" data-filter="read" onclick="filterNotifications('read')">مقروءة</button>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="markAllRead()" class="btn btn-outline btn-sm">تحديد الكل كمقروء</button>
                        <button onclick="clearAllNotifications()" class="btn btn-danger btn-sm">حذف الكل</button>
                    </div>
                </div>
                <div id="notificationsList"></div>
            </div>
        </div>

        <!-- Reminders Tab -->
        <div id="tab-reminders" class="tab-content">
            <div class="bg-surface rounded-2xl border border-line p-4 md:p-5">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div class="flex flex-wrap gap-2">
                        <button class="filter-btn active" data-filter="all" onclick="filterReminders('all')">الكل</button>
                        <button class="filter-btn" data-filter="pending" onclick="filterReminders('pending')">قيد الانتظار</button>
                        <button class="filter-btn" data-filter="done" onclick="filterReminders('done')">منتهية</button>
                    </div>
                    <button onclick="openAddReminder()" class="btn btn-gold btn-sm"><i class="fas fa-plus"></i> تذكير جديد</button>
                </div>
                <div id="remindersList"></div>
            </div>
        </div>
    </div>

    <!-- Modal: إضافة / تعديل تذكير -->
    <div class="modal-overlay" id="reminderModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('reminderModal')">✕</button>
            <div class="modal-title" id="reminderModalTitle">إضافة تذكير جديد</div>
            <form id="reminderForm">
                <input type="hidden" id="editReminderId" value="" />
                <div class="grid-2">
                    <div class="field full-width"><label>العنوان *</label><input type="text" id="remTitle" required placeholder="مثال: متابعة عرض ع-١٢٣" /></div>
                    <div class="field"><label>التاريخ *</label><input type="date" id="remDate" required /></div>
                    <div class="field"><label>الوقت</label><input type="time" id="remTime" /></div>
                    <div class="field full-width"><label>الملاحظات</label><textarea id="remNotes" rows="3" placeholder="تفاصيل التذكير..."></textarea></div>
                    <div class="field full-width"><label>الربط مع (اختياري)</label>
                        <select id="remLinkType"><option value="">لا يوجد ربط</option><option value="offer">عرض</option><option value="request">طلب</option></select>
                    </div>
                    <div class="field full-width" id="remLinkIdContainer" style="display:none;"><label>رقم العرض/الطلب</label><input type="text" id="remLinkId" placeholder="مثال: ع-١٢٣ أو ط-١٠١" /></div>
                </div>
                <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap">
                    <button type="button" class="btn btn-outline" onclick="closeModal('reminderModal')">إلغاء</button>
                    <button type="submit" class="btn btn-gold">💾 حفظ التذكير</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="sidebar.js"></script>
<script src="api.js"></script>
<script src="global.js"></script>
<script>
// ============================================================
// ALERTS & REMINDERS - كامل مع جميع المميزات
// ============================================================

let notifications = [];
let reminders = [];
let currentNotifFilter = 'all';
let currentReminderFilter = 'all';
let isAuthChecked = false;

// ============================================================
// AUTH - محسنة
// ============================================================
async function checkAuth() {
    if (isAuthChecked && API.isAuthenticated()) {
        return true;
    }

    const token = localStorage.getItem('masar_token');
    const overlay = document.getElementById('loginOverlay');
    const mainContent = document.getElementById('mainContent');

    if (token) {
        try {
            const result = await API.auth.me();
            if (result.status === 'success') {
                API.token = token;
                overlay.classList.remove('show');
                mainContent.classList.add('visible');
                isAuthChecked = true;
                return true;
            } else {
                localStorage.removeItem('masar_token');
                localStorage.removeItem('masar_user');
                API.token = null;
            }
        } catch (err) {
            console.warn('خطأ في التحقق من التوكن:', err.message);
            localStorage.removeItem('masar_token');
            localStorage.removeItem('masar_user');
            API.token = null;
        }
    }

    overlay.classList.add('show');
    mainContent.classList.remove('visible');
    isAuthChecked = false;
    return false;
}

// تسجيل الدخول
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    const submitBtn = this.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> جاري الدخول...';

    try {
        const result = await API.auth.login(email, password);
        if (result.status === 'success') {
            errorEl.style.display = 'none';
            if (result.data?.user) {
                localStorage.setItem('masar_user', JSON.stringify(result.data.user));
            }
            const isAuth = await checkAuth();
            if (isAuth) {
                showToast('✅ تم تسجيل الدخول بنجاح', 'success');
                loadData();
            }
        } else {
            errorEl.textContent = result.message || 'فشل تسجيل الدخول';
            errorEl.style.display = 'block';
        }
    } catch (err) {
        errorEl.textContent = err.message || 'حدث خطأ في الاتصال';
        errorEl.style.display = 'block';
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
    }
});

// ============================================================
// HELPERS
// ============================================================
function formatDate(d) {
    if (!d) return '-';
    try {
        const date = new Date(d);
        return date.toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
    } catch (e) {
        return d;
    }
}

function formatTime(d) {
    if (!d) return '';
    try {
        const date = new Date(d);
        return date.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
        return '';
    }
}

// ============================================================
// LOAD DATA
// ============================================================
async function loadData() {
    if (!API.isAuthenticated()) {
        await checkAuth();
        return;
    }

    try {
        // تحميل التذكيرات من API
        const remindersResult = await API.reminders.list();
        if (remindersResult.status === 'success') {
            reminders = remindersResult.data || [];
        } else {
            // إذا فشل API، استخدم التخزين المحلي
            const localReminders = localStorage.getItem('masarRemindersLocal');
            if (localReminders) {
                try {
                    reminders = JSON.parse(localReminders);
                } catch (e) {}
            }
        }

        // تحميل الإشعارات من لوحة التحكم
        const dashboardResult = await API.reports.dashboard();
        if (dashboardResult.status === 'success') {
            notifications = dashboardResult.data.alerts || [];
        }

        renderNotifications();
        renderReminders();
        renderStats();
    } catch (err) {
        showToast(err.message || 'حدث خطأ في تحميل البيانات', 'error');
    }
}

function saveRemindersLocally() {
    localStorage.setItem('masarRemindersLocal', JSON.stringify(reminders));
}

// ============================================================
// RENDER NOTIFICATIONS
// ============================================================
function renderNotifications() {
    let filtered = [...notifications];
    if (currentNotifFilter === 'unread') {
        filtered = filtered.filter(n => !n.read);
    } else if (currentNotifFilter === 'read') {
        filtered = filtered.filter(n => n.read);
    }
    filtered.sort((a, b) => new Date(b.time) - new Date(a.time));

    const container = document.getElementById('notificationsList');
    const badge = document.getElementById('notifBadge');
    const unread = notifications.filter(n => !n.read).length;
    badge.textContent = unread;

    document.getElementById('totalNotifications').textContent = notifications.length;
    document.getElementById('unreadNotifications').textContent = unread;

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="text-center py-10 text-muted">
                <div class="text-4xl mb-3">🔔</div>
                <p>لا توجد إشعارات</p>
                <p class="text-sm">ستظهر هنا الإشعارات القادمة من النظام</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(n => `
        <div class="notif-item ${n.read ? '' : 'unread'}">
            <div class="notif-icon">${n.icon || '📢'}</div>
            <div class="notif-content">
                <div class="notif-title">${n.title}</div>
                <div class="notif-message">${n.message}</div>
                <div class="notif-time">${formatDate(n.time)} ${formatTime(n.time)}</div>
            </div>
            <div class="notif-actions">
                ${n.link ? `<button onclick="window.location.href='${n.link}'" title="فتح"><i class="fas fa-external-link-alt"></i></button>` : ''}
                ${!n.read ? `<button onclick="markRead('${n.id}')" title="تحديد كمقروء"><i class="fas fa-check"></i></button>` : ''}
                <button class="danger" onclick="deleteNotification('${n.id}')" title="حذف"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `).join('');

    document.querySelectorAll('#tab-notifications .filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === currentNotifFilter);
    });
}

function filterNotifications(filter) {
    currentNotifFilter = filter;
    renderNotifications();
}

function markRead(id) {
    const n = notifications.find(x => x.id === id);
    if (n) {
        n.read = true;
        renderNotifications();
        renderStats();
        showToast('✅ تم تحديد الإشعار كمقروء', 'success');
    }
}

function markAllRead() {
    notifications.forEach(n => n.read = true);
    renderNotifications();
    renderStats();
    showToast('✅ تم تحديد جميع الإشعارات كمقروءة', 'success');
}

function deleteNotification(id) {
    notifications = notifications.filter(n => n.id !== id);
    renderNotifications();
    renderStats();
}

function clearAllNotifications() {
    if (!confirm('هل أنت متأكد من حذف جميع الإشعارات؟')) return;
    notifications = [];
    renderNotifications();
    renderStats();
    showToast('🗑️ تم حذف جميع الإشعارات', 'info');
}

// ============================================================
// RENDER REMINDERS
// ============================================================
function renderReminders() {
    let filtered = [...reminders];
    if (currentReminderFilter === 'pending') {
        filtered = filtered.filter(r => !r.done);
    } else if (currentReminderFilter === 'done') {
        filtered = filtered.filter(r => r.done);
    }
    filtered.sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return new Date(a.reminder_time) - new Date(b.reminder_time);
    });

    const container = document.getElementById('remindersList');
    const badge = document.getElementById('reminderBadge');
    const pending = reminders.filter(r => !r.done).length;
    badge.textContent = pending;

    document.getElementById('totalReminders').textContent = reminders.length;
    const now = new Date().toISOString();
    const overdue = reminders.filter(r => !r.done && r.reminder_time && r.reminder_time < now).length;
    document.getElementById('overdueReminders').textContent = overdue;

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="text-center py-10 text-muted">
                <div class="text-4xl mb-3">⏰</div>
                <p>لا توجد تذكيرات</p>
                <p class="text-sm">أضف تذكيراً جديداً لتلقي إشعارات بالمهام المهمة</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(r => `
        <div class="reminder-item ${r.done ? 'done' : ''}">
            <div class="reminder-header">
                <div class="reminder-title">${r.title}</div>
                <div class="reminder-date">${formatDate(r.reminder_time)} ${formatTime(r.reminder_time)}</div>
            </div>
            ${r.notes ? `<div class="reminder-notes">${r.notes}</div>` : ''}
            ${r.link_id ? `<div class="text-xs text-muted mt-1">🔗 مرتبط بـ ${r.link_id}</div>` : ''}
            <div class="reminder-actions">
                ${!r.done ? `<button class="done-btn" onclick="toggleReminderDone('${r.id}')">✅ تم الإنجاز</button>` : `<button class="done-btn" onclick="toggleReminderDone('${r.id}')" style="background:#1A2740;color:#8B96A8;">↩️ إعادة فتح</button>`}
                <button class="edit-btn" onclick="editReminder('${r.id}')"><i class="fas fa-pen"></i> تعديل</button>
                <button class="delete-btn" onclick="deleteReminder('${r.id}')"><i class="fas fa-trash"></i> حذف</button>
            </div>
        </div>
    `).join('');

    document.querySelectorAll('#tab-reminders .filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === currentReminderFilter);
    });
}

function filterReminders(filter) {
    currentReminderFilter = filter;
    renderReminders();
}

async function toggleReminderDone(id) {
    const r = reminders.find(x => x.id === id);
    if (!r) return;
    
    try {
        const result = await API.reminders.markDone(id);
        if (result.status === 'success') {
            r.done = !r.done;
            saveRemindersLocally();
            renderReminders();
            renderStats();
            showToast(r.done ? '✅ تم إنجاز التذكير' : '↩️ تم إعادة فتح التذكير', 'success');
        } else {
            showToast(result.message || 'فشل تحديث التذكير', 'error');
        }
    } catch (err) {
        showToast(err.message || 'حدث خطأ', 'error');
    }
}

async function deleteReminder(id) {
    if (!confirm('هل أنت متأكد من حذف هذا التذكير؟')) return;
    try {
        const result = await API.reminders.delete(id);
        if (result.status === 'success') {
            reminders = reminders.filter(r => r.id !== id);
            saveRemindersLocally();
            renderReminders();
            renderStats();
            showToast('🗑️ تم حذف التذكير', 'info');
        } else {
            showToast(result.message || 'فشل حذف التذكير', 'error');
        }
    } catch (err) {
        showToast(err.message || 'حدث خطأ', 'error');
    }
}

// ============================================================
// REMINDER MODAL
// ============================================================
function openAddReminder() {
    document.getElementById('reminderModalTitle').textContent = 'إضافة تذكير جديد';
    document.getElementById('editReminderId').value = '';
    document.getElementById('remTitle').value = '';
    document.getElementById('remDate').value = new Date().toISOString().slice(0, 10);
    document.getElementById('remTime').value = '';
    document.getElementById('remNotes').value = '';
    document.getElementById('remLinkType').value = '';
    document.getElementById('remLinkId').value = '';
    document.getElementById('remLinkIdContainer').style.display = 'none';
    document.getElementById('reminderModal').classList.add('active');
}

function editReminder(id) {
    const r = reminders.find(x => x.id === id);
    if (!r) { showToast('التذكير غير موجود', 'error'); return; }
    document.getElementById('reminderModalTitle').textContent = 'تعديل التذكير';
    document.getElementById('editReminderId').value = id;
    document.getElementById('remTitle').value = r.title;
    document.getElementById('remDate').value = r.reminder_time ? r.reminder_time.slice(0, 10) : '';
    document.getElementById('remTime').value = r.reminder_time ? r.reminder_time.slice(11, 16) : '';
    document.getElementById('remNotes').value = r.notes || '';
    document.getElementById('remLinkType').value = r.link_type || '';
    document.getElementById('remLinkId').value = r.link_id || '';
    document.getElementById('remLinkIdContainer').style.display = r.link_type ? 'block' : 'none';
    document.getElementById('reminderModal').classList.add('active');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

document.getElementById('remLinkType').addEventListener('change', function() {
    document.getElementById('remLinkIdContainer').style.display = this.value ? 'block' : 'none';
});

document.getElementById('reminderForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const editId = document.getElementById('editReminderId').value;
    const title = document.getElementById('remTitle').value.trim();
    const date = document.getElementById('remDate').value;
    const time = document.getElementById('remTime').value;
    const notes = document.getElementById('remNotes').value.trim();
    const linkType = document.getElementById('remLinkType').value;
    const linkId = document.getElementById('remLinkId').value.trim();

    if (!title || !date) {
        showToast('يرجى ملء العنوان والتاريخ', 'error');
        return;
    }

    const reminderTime = date + (time ? ' ' + time + ':00' : ' 00:00:00');

    const data = {
        title: title,
        reminder_time: reminderTime,
        notes: notes,
        link_type: linkType,
        link_id: linkId
    };

    try {
        let result;
        if (editId) {
            result = await API.reminders.update(editId, data);
        } else {
            result = await API.reminders.create(data);
        }

        if (result.status === 'success') {
            closeModal('reminderModal');
            showToast('✅ تم حفظ التذكير', 'success');
            await loadData();
        } else {
            showToast(result.message || 'فشل حفظ التذكير', 'error');
        }
    } catch (err) {
        showToast(err.message || 'حدث خطأ', 'error');
    }
});

// ============================================================
// STATS
// ============================================================
function renderStats() {
    const unread = notifications.filter(n => !n.read).length;
    document.getElementById('unreadNotifications').textContent = unread;
    document.getElementById('totalNotifications').textContent = notifications.length;
    document.getElementById('totalReminders').textContent = reminders.length;
    const now = new Date().toISOString();
    const overdue = reminders.filter(r => !r.done && r.reminder_time && r.reminder_time < now).length;
    document.getElementById('overdueReminders').textContent = overdue;
    document.getElementById('notifBadge').textContent = unread;
    document.getElementById('reminderBadge').textContent = reminders.filter(r => !r.done).length;
}

// ============================================================
// TAB SWITCH
// ============================================================
function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
    if (tab === 'notifications') renderNotifications();
    else renderReminders();
}

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.active').forEach(el => el.classList.remove('active'));
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
        e.preventDefault();
        openAddReminder();
    }
});

// ============================================================
// NOTIFICATION PERMISSION
// ============================================================
if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async function() {
    const isAuth = await checkAuth();
    if (isAuth) {
        loadData();
        setInterval(loadData, 60000);
    }
});

// ============================================================
// EXPOSE GLOBALS
// ============================================================
window.switchTab = switchTab;
window.filterNotifications = filterNotifications;
window.filterReminders = filterReminders;
window.markRead = markRead;
window.markAllRead = markAllRead;
window.deleteNotification = deleteNotification;
window.clearAllNotifications = clearAllNotifications;
window.toggleReminderDone = toggleReminderDone;
window.deleteReminder = deleteReminder;
window.openAddReminder = openAddReminder;
window.editReminder = editReminder;
window.closeModal = closeModal;
window.showToast = showToast;
window.checkAuth = checkAuth;
window.loadData = loadData;
</script>
</body>
</html>
