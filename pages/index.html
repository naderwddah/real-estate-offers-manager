<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>تسجيل الدخول | عقاري CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* جميع الأنماط كما هي تماماً (تم حذفها للاختصار ولكن ضعها كاملة) */
        :root {
            --bg-body: #faf8f5;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.72);
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: rgba(0, 0, 0, 0.06);
            --border-glass: rgba(255, 255, 255, 0.5);
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
            --shadow-gold: 0 4px 20px rgba(212, 175, 55, 0.15);
            --gold-primary: #d4af37;
            --gold-light: #e8d5a3;
            --gold-dark: #b8941f;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #c9a227 50%, #b8941f 100%);
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --radius-sm: 12px;
            --radius: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html.dark {
            --bg-body: #0f1117;
            --bg-card: #1a1d29;
            --bg-glass: rgba(26, 29, 41, 0.72);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.4);
            --shadow-gold: 0 4px 20px rgba(212, 175, 55, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.5s ease, color 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .login-page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--border-glass);
            border: 1px solid var(--border-glass);
            transition: var(--transition);
            animation: cardIn 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo {
            width: 72px;
            height: 72px;
            background: var(--gold-gradient);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 8px 32px rgba(212, 175, 55, 0.5); }
        }

        .login-logo i {
            font-size: 1.8rem;
            color: #fff;
        }

        .login-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .login-header h1 span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        #loginError {
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--danger-light);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(239,68,68,0.15);
            animation: shake 0.4s ease-in-out;
        }

        #loginError.show {
            display: flex;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .field-group label i {
            color: var(--gold-primary);
            font-size: 0.8rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper > i:first-child {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
            transition: var(--transition);
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 44px 14px 44px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        .toggle-password {
            position: absolute;
            left: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 8px;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .toggle-password:hover {
            color: var(--gold-primary);
            background: var(--sidebar-hover, rgba(212,175,55,0.08));
        }

        .btn-gold {
            width: 100%;
            padding: 16px;
            background: var(--gold-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-gold::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-gold:hover::before {
            left: 100%;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
        }

        .btn-gold:active {
            transform: translateY(0);
        }

        .btn-gold i {
            font-size: 1rem;
        }

        .footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .footer-links a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
        }

        .footer-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 0;
            height: 2px;
            background: var(--gold-gradient);
            border-radius: 2px;
            transition: width 0.3s;
        }

        .footer-links a:hover::after {
            width: 100%;
        }

        .footer-links a:hover {
            color: var(--gold-dark);
        }

        .theme-toggle-login {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            font-size: 1.1rem;
            color: var(--text-primary);
            cursor: pointer;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            z-index: 10;
            box-shadow: var(--shadow);
        }

        .theme-toggle-login:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: rotate(15deg);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: var(--radius-lg);
            }
            .login-header h1 {
                font-size: 1.3rem;
            }
            .login-logo {
                width: 60px;
                height: 60px;
            }
            .login-logo i {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle-login" id="themeToggle" aria-label="تبديل الوضع">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>

    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-building"></i>
                </div>
                <h1>عقاري <span>CRM</span></h1>
                <p>تسجيل الدخول إلى لوحة التحكم</p>
            </div>

            <form id="loginForm" novalidate>
                <div id="loginError">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">بيانات الدخول غير صحيحة</span>
                </div>

                <div class="field-group">
                    <label for="loginEmail">
                        <i class="fas fa-envelope"></i> البريد الإلكتروني
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input
                            type="email"
                            id="loginEmail"
                            value="admin@masar.sa"
                            placeholder="admin@masar.sa"
                            required
                            autocomplete="email"
                        />
                    </div>
                </div>

                <div class="field-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> كلمة المرور
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input
                            type="password"
                            id="loginPassword"
                            value="Admin.123"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        />
                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="إظهار كلمة المرور"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-gold" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>دخول</span>
                </button>

                <div class="footer-links">
                    <span>نسيت كلمة المرور؟</span>
                    <a href="#">تواصل مع الدعم</a>
                </div>
            </form>
        </div>
    </div>

    <!-- ====== تحميل api.js ومن ثم تشغيل المنطق ====== -->
    <script src="../assets/js/core/api.js"></script>
    <script>
        (function() {
            'use strict';

            // التأكد من أن API متاح
            if (typeof window.API === 'undefined') {
                console.error('API object not found. Make sure api.js is loaded.');
                return;
            }

            // ---- عناصر الصفحة ----
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('loginEmail');
            const passInput = document.getElementById('loginPassword');
            const loginBtn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('loginError');
            const errorText = document.getElementById('errorText');
            const toggleBtn = document.getElementById('togglePassword');
            const toggleIcon = toggleBtn.querySelector('i');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            // ---- الثيم ----
            const storedTheme = localStorage.getItem('theme') || 'light';
            const isDark = storedTheme === 'dark';
            document.documentElement.classList.toggle('dark', isDark);
            themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';

            themeToggle.addEventListener('click', () => {
                const currentlyDark = document.documentElement.classList.contains('dark');
                const newDark = !currentlyDark;
                document.documentElement.classList.toggle('dark', newDark);
                localStorage.setItem('theme', newDark ? 'dark' : 'light');
                themeIcon.className = newDark ? 'fas fa-sun' : 'fas fa-moon';
            });

            // ---- إظهار/إخفاء كلمة المرور ----
            toggleBtn.addEventListener('click', () => {
                const isPassword = passInput.type === 'password';
                passInput.type = isPassword ? 'text' : 'password';
                toggleIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            });

            // ---- التحقق من التوكن عند التحميل ----
            async function checkAuthAndRedirect() {
                try {
                    const isValid = await window.API.verifyToken();
                    if (isValid) {
                        window.location.href = 'dashboard.html';
                    }
                } catch {
                    // تجاهل الأخطاء
                }
            }
            checkAuthAndRedirect();

            // ---- تسجيل الدخول ----
            const originalBtnHtml = loginBtn.innerHTML;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.classList.remove('show');

                const email = emailInput.value.trim();
                const password = passInput.value.trim();

                if (!email) {
                    errorText.textContent = 'الرجاء إدخال البريد الإلكتروني';
                    errorBox.classList.add('show');
                    return;
                }
                if (!password) {
                    errorText.textContent = 'الرجاء إدخال كلمة المرور';
                    errorBox.classList.add('show');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>جاري الدخول...</span>';

                try {
                    const result = await window.API.auth.login(email, password);
                    if (result.status === 'success' && result.data?.token) {
                        window.location.href = 'dashboard.html';
                    } else {
                        errorText.textContent = result.message || 'حدث خطأ غير متوقع';
                        errorBox.classList.add('show');
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = originalBtnHtml;
                    }
                } catch (err) {
                    errorText.textContent = err.message || 'فشل تسجيل الدخول، يرجى المحاولة مرة أخرى';
                    errorBox.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = originalBtnHtml;
                }
            });
        })();
    </script>
</body>
</html>
