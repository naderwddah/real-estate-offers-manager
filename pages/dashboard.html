<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم | عقاري CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'Segoe UI', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .dash-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .dash-card:hover {
            box-shadow: var(--shadow-lg);
        }
        .stat-box {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition-slow);
            position: relative;
            overflow: hidden;
        }
        .stat-box::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 3px;
            background: var(--gold-gradient);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stat-box:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg), var(--shadow-gold);
        }
        .stat-box:hover::after { opacity: 1; }
        .stat-icon-box {
            width: 48px;
            height: 48px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--transition);
        }
        .stat-box:hover .stat-icon-box {
            transform: scale(1.1) rotate(-5deg);
        }
        .skeleton {
            background: linear-gradient(90deg, var(--border-color) 25%, var(--bg-body) 50%, var(--border-color) 75%);
            background-size: 200% 100%;
            animation: skeleton 1.2s infinite;
            border-radius: 8px;
        }
        @keyframes skeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .table-row {
            transition: var(--transition);
            border-bottom: 1px solid var(--border-color);
        }
        .table-row:last-child { border-bottom: none; }
        .table-row:hover {
            background: var(--sidebar-hover);
        }
        .stage-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .reminder-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .reminder-item:hover {
            border-color: var(--gold-primary);
            box-shadow: var(--shadow-gold);
        }
        .reminder-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 6px;
        }
        .reminder-overdue { background: var(--danger); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
        .reminder-upcoming { background: var(--warning); }
        .reminder-done { background: var(--success); }
        .chart-bar {
            height: 8px;
            border-radius: 4px;
            background: var(--gold-gradient);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .city-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .city-item:last-child { border-bottom: none; }
        @media (max-width: 640px) {
            .stat-box { padding: 16px; }
            .dash-card { padding: 16px; }
        }
    </style>

</head>
<body>
    <main class="main-content">
        <!-- Stats Row -->
        <div class="grid grid-cols-2 xl:grid-cols-4 gap-4 mb-6" id="statsContainer">
            <div class="stat-box">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="text-xs font-medium" style="color: var(--text-secondary);">إجمالي العروض</p>
                        <div class="skeleton w-16 h-8 mt-1"></div>
                    </div>
                    <div class="stat-icon-box" style="background: linear-gradient(135deg, #fef3c7, #fde68a); color: #b45309;">
                        <i class="fas fa-tags"></i>
                    </div>
                </div>
            </div>
            <div class="stat-box">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="text-xs font-medium" style="color: var(--text-secondary);">العروض النشطة</p>
                        <div class="skeleton w-16 h-8 mt-1"></div>
                    </div>
                    <div class="stat-icon-box" style="background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1d4ed8;">
                        <i class="fas fa-bolt"></i>
                    </div>
                </div>
            </div>
            <div class="stat-box">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="text-xs font-medium" style="color: var(--text-secondary);">إجمالي الطلبات</p>
                        <div class="skeleton w-16 h-8 mt-1"></div>
                    </div>
                    <div class="stat-icon-box" style="background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #059669;">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                </div>
            </div>
            <div class="stat-box">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="text-xs font-medium" style="color: var(--text-secondary);">العملاء</p>
                        <div class="skeleton w-16 h-8 mt-1"></div>
                    </div>
                    <div class="stat-icon-box" style="background: linear-gradient(135deg, #fce7f3, #fbcfe8); color: #be185d;">
                        <i class="fas fa-users"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Second Stats Row -->
        <div class="grid grid-cols-2 xl:grid-cols-4 gap-4 mb-6" id="statsContainer2">
            <div class="stat-box">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="text-xs font-medium" style="color: var(--text-secondary);">عروض الشركة</p>
                        <div class="skeleton w-16 h-8 mt-1"></div>
                    </div>
                    <div class="stat-icon-box" style="background: linear-gradient(135deg, #e0e7ff, #c7d2fe); color: #4338ca;">
                        <i class="fas fa-building"></i>
                    </div>
                </div>
            </div>
            <div class="stat-box">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="text-xs font-medium" style="color: var(--text-secondary);">عروض شخصية</p>
                        <div class="skeleton w-16 h-8 mt-1"></div>
                    </div>
                    <div class="stat-icon-box" style="background: linear-gradient(135deg, #fef9c3, #fde047); color: #a16207;">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>
            <div class="stat-box">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="text-xs font-medium" style="color: var(--text-secondary);">مكتملة - عروض</p>
                        <div class="skeleton w-16 h-8 mt-1"></div>
                    </div>
                    <div class="stat-icon-box" style="background: linear-gradient(135deg, #dcfce7, #86efac); color: #15803d;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                </div>
            </div>
            <div class="stat-box">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="text-xs font-medium" style="color: var(--text-secondary);">مكتملة - طلبات</p>
                        <div class="skeleton w-16 h-8 mt-1"></div>
                    </div>
                    <div class="stat-icon-box" style="background: linear-gradient(135deg, #ccfbf1, #5eead4); color: #0f766e;">
                        <i class="fas fa-check-double"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cities Distribution -->
        <div class="dash-card mb-6" id="citiesCard">
            <h2 class="section-title mb-4">توزيع العروض حسب المدينة</h2>
            <div id="citiesList">
                <div class="skeleton w-full h-12 mb-3"></div>
                <div class="skeleton w-full h-12 mb-3"></div>
                <div class="skeleton w-full h-12"></div>
            </div>
        </div>

        <!-- Recent Offers & Requests -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <!-- Recent Offers -->
            <div class="dash-card">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="section-title" style="margin-bottom:0;">آخر العروض</h2>
                    <a href="offers.html" class="text-xs font-semibold" style="color:var(--gold-primary);">
                        عرض الكل <i class="fas fa-arrow-left mr-1"></i>
                    </a>
                </div>
                <div id="recentOffersList">
                    <div class="skeleton w-full h-14 mb-2"></div>
                    <div class="skeleton w-full h-14 mb-2"></div>
                    <div class="skeleton w-full h-14"></div>
                </div>
            </div>

            <!-- Recent Requests -->
            <div class="dash-card">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="section-title" style="margin-bottom:0;">آخر الطلبات</h2>
                    <a href="requests.html" class="text-xs font-semibold" style="color:var(--gold-primary);">
                        عرض الكل <i class="fas fa-arrow-left mr-1"></i>
                    </a>
                </div>
                <div id="recentRequestsList">
                    <div class="skeleton w-full h-14 mb-2"></div>
                    <div class="skeleton w-full h-14 mb-2"></div>
                    <div class="skeleton w-full h-14"></div>
                </div>
            </div>
        </div>

        <!-- Reminders -->
        <div class="dash-card mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="section-title" style="margin-bottom:0;">التنبيهات والتذكيرات</h2>
                <a href="alerts.html" class="text-xs font-semibold" style="color:var(--gold-primary);">
                    عرض الكل <i class="fas fa-arrow-left mr-1"></i>
                </a>
            </div>
            <div id="remindersList">
                <div class="skeleton w-full h-16 mb-2"></div>
                <div class="skeleton w-full h-16 mb-2"></div>
            </div>
        </div>
    </main>

    <script src="../assets/js/core/api.js"></script>
    <script src="../assets/js/components/global.js"></script>
    <script src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
