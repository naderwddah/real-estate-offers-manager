<!-- pages/alerts.html - التنبيهات والتذكيرات (نسخة متوافقة مع global.css) -->
<!-- ============================================================ -->
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>مسار — التنبيهات والتذكيرات</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap");

      /* ===== ربط متغيرات الصفحة بمتغيرات global.css ===== */
      :root {
        --bg-primary: var(--bg-body);
        --bg-secondary: var(--bg-card);
        --bg-surface: var(--bg-card);
        --bg-surface2: var(--bg-card);
        --bg-surface3: var(--bg-card);
        --card-bg: var(--bg-card);
        --hover-bg: rgba(212, 175, 55, 0.08);
        --input-bg: var(--bg-card);
        --shadow-color: rgba(0, 0, 0, 0.1);

        --gold: var(--gold-primary);
        --gold-soft: var(--gold-light);
        --emerald: var(--success);
        --emerald-soft: var(--success-light);
        --danger: var(--danger);
        --terracotta: #c0392b;
        --terracotta-soft: var(--danger-light);
        --border-light: var(--border-color);
        --text-muted: var(--text-secondary);
        --info: #3b82f6;
        --warning: #f59e0b;
      }

      * {
        font-family: "Tajawal", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg-body);
        min-height: 100vh;
        color: var(--text-primary);
      }

      /* ===== فئات مساعدة ===== */
      .bg-surface {
        background: var(--bg-card);
      }
      .bg-surface2 {
        background: var(--bg-card);
      }
      .bg-surface3 {
        background: var(--bg-card);
      }
      .bg-bg {
        background: var(--bg-body);
      }
      .text-muted {
        color: var(--text-secondary);
      }
      .text-ink {
        color: var(--text-primary);
      }
      .border-line {
        border-color: var(--border-color);
      }
      .bg-gold {
        background: var(--gold-primary);
      }
      .text-gold {
        color: var(--gold-primary);
      }
      .bg-emerald {
        background: var(--success);
      }
      .text-emerald {
        color: var(--success);
      }
      .bg-danger {
        background: var(--danger);
      }
      .text-danger {
        color: var(--danger);
      }

      /* ===== ألوان مخصصة للإحصائيات ===== */
      .stat-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
      }
      .stat-icon.gold {
        background: var(--gold-light);
        color: var(--gold-primary);
      }
      .stat-icon.warning {
        background: var(--warning-light);
        color: var(--warning);
      }
      .stat-icon.emerald {
        background: var(--success-light);
        color: var(--success);
      }
      .stat-icon.danger {
        background: var(--danger-light);
        color: var(--danger);
      }

      html.dark .stat-icon.gold {
        background: rgba(212, 175, 55, 0.2);
        color: var(--gold-primary);
      }
      html.dark .stat-icon.warning {
        background: rgba(245, 158, 11, 0.2);
        color: var(--warning);
      }
      html.dark .stat-icon.emerald {
        background: rgba(16, 185, 129, 0.2);
        color: var(--success);
      }
      html.dark .stat-icon.danger {
        background: rgba(239, 68, 68, 0.2);
        color: var(--danger);
      }

      /* ===== بطاقات الإحصائيات ===== */
      .stat-card {
        transition: all 0.25s ease;
        border: 1px solid var(--border-color);
        cursor: pointer;
        background: var(--bg-card);
      }
      .stat-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
      }

      /* ===== أزرار ===== */
      .btn {
        padding: 10px 28px;
        border-radius: 40px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.95rem;
      }
      .btn-gold {
        background: var(--gold-primary);
        color: var(--text-primary);
      }
      .btn-gold:hover {
        background: var(--gold-light);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.25);
      }
      .btn-outline {
        background: transparent;
        color: var(--text-primary);
        border: 2px solid var(--border-color);
      }
      .btn-outline:hover {
        background: var(--bg-card);
        color: var(--text-primary);
      }
      .btn-sm {
        padding: 6px 16px;
        font-size: 0.8rem;
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-danger:hover {
        background: var(--terracotta);
      }

      /* ===== باقي الأنماط ===== */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 14px;
        border-radius: 30px;
        font-size: 0.78rem;
        font-weight: 600;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(4, 8, 14, 0.72);
        backdrop-filter: blur(4px);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-y: auto;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-box {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        max-width: 600px;
        width: 100%;
        max-height: 92vh;
        overflow-y: auto;
        padding: 28px 32px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        animation: modalFadeIn 0.25s ease;
        position: relative;
      }
      @keyframes modalFadeIn {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(20px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .modal-close {
        position: sticky;
        top: 0;
        float: left;
        background: none;
        border: none;
        font-size: 28px;
        color: var(--text-secondary);
        cursor: pointer;
        transition: color 0.2s;
        line-height: 1;
        z-index: 10;
      }
      .modal-close:hover {
        color: var(--text-primary);
      }
      .modal-title {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 20px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .field input,
      .field select,
      .field textarea {
        border: 2px solid var(--border-color);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 0.9rem;
        transition: border 0.2s;
        background: var(--bg-card);
        color: var(--text-primary);
        width: 100%;
        font-family: "Tajawal", sans-serif;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--gold-primary);
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08);
      }
      .field input::placeholder,
      .field textarea::placeholder {
        color: var(--text-secondary);
      }
      .field.full-width {
        grid-column: 1 / -1;
      }

      .toast {
        position: fixed;
        bottom: 30px;
        left: 30px;
        background: var(--bg-card);
        color: var(--text-primary);
        padding: 14px 28px;
        border-radius: 14px;
        font-weight: 500;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        z-index: 9999;
        display: none;
        align-items: center;
        gap: 12px;
        animation: slideUp 0.3s ease;
        max-width: 90%;
        border: 1px solid var(--border-color);
      }
      .toast.show {
        display: flex;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .notif-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        transition: all 0.2s;
        margin-bottom: 8px;
      }
      .notif-item:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .notif-item.unread {
        border-right: 4px solid var(--gold-primary);
        background: var(--bg-card);
      }
      .notif-item .notif-icon {
        font-size: 1.4rem;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .notif-item .notif-content {
        flex: 1;
      }
      .notif-item .notif-title {
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--text-primary);
      }
      .notif-item .notif-message {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .notif-item .notif-time {
        font-size: 0.7rem;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .notif-item .notif-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        align-items: center;
      }
      .notif-item .notif-actions button {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-secondary);
        transition: color 0.2s;
        font-size: 0.9rem;
        padding: 4px 6px;
      }
      .notif-item .notif-actions button:hover {
        color: var(--gold-primary);
      }
      .notif-item .notif-actions button.danger:hover {
        color: var(--danger);
      }

      .reminder-item {
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        margin-bottom: 8px;
        transition: all 0.2s;
      }
      .reminder-item:hover {
        border-color: var(--gold-primary);
      }
      .reminder-item.done {
        opacity: 0.5;
        background: var(--bg-body);
      }
      .reminder-item .reminder-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 8px;
      }
      .reminder-item .reminder-title {
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--text-primary);
      }
      .reminder-item .reminder-date {
        font-size: 0.75rem;
        color: var(--text-secondary);
      }
      .reminder-item .reminder-notes {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .reminder-item .reminder-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .reminder-item .reminder-actions button {
        padding: 2px 12px;
        border-radius: 20px;
        border: none;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .reminder-item .reminder-actions .done-btn {
        background: var(--success);
        color: #fff;
      }
      .reminder-item .reminder-actions .done-btn:hover {
        background: var(--success-light);
      }
      .reminder-item .reminder-actions .edit-btn {
        background: var(--bg-card);
        color: var(--text-primary);
      }
      .reminder-item .reminder-actions .edit-btn:hover {
        background: var(--bg-body);
      }
      .reminder-item .reminder-actions .delete-btn {
        background: var(--danger-light);
        color: var(--danger);
      }
      .reminder-item .reminder-actions .delete-btn:hover {
        background: var(--terracotta-soft);
      }

      .tab-btn {
        padding: 8px 20px;
        border: none;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s;
        background: transparent;
        color: var(--text-secondary);
      }
      .tab-btn.active {
        background: var(--gold-primary);
        color: var(--text-primary);
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
      }
      .tab-btn:hover:not(.active) {
        background: var(--bg-card);
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }

      .filter-btn {
        padding: 4px 14px;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        background: transparent;
        color: var(--text-secondary);
      }
      .filter-btn.active {
        background: var(--gold-primary);
        color: var(--text-primary);
        border-color: var(--gold-primary);
      }
      .filter-btn:hover:not(.active) {
        background: var(--bg-card);
      }

      @media (max-width: 768px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .modal-box {
          padding: 16px;
        }
      }

      .main-content {
        display: none !important;
      }
      .main-content.visible {
        display: block !important;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: inline-block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- TOAST -->
    <div class="toast" id="toast">
      <i class="fas fa-check-circle text-emerald"></i>
      <span id="toastMessage">تم الإجراء بنجاح</span>
    </div>

    <!-- SIDEBAR (سيتم تحميله عبر global.js) -->
    <div id="sidebar-placeholder"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
      <div class="max-w-6xl mx-auto px-3 sm:px-5 lg:px-8 py-5 md:py-8">
        <!-- Header -->
        <div
          class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6"
        >
          <div>
            <h1
              class="text-2xl md:text-3xl font-extrabold text-gold tracking-tight"
            >
              <i class="fas fa-bell ml-2 text-gold"></i>التنبيهات والتذكيرات
            </h1>
            <p class="text-sm text-muted mt-1">
              إدارة جميع الإشعارات والتذكيرات في مكان واحد
            </p>
          </div>
          <button onclick="openAddReminder()" class="btn btn-gold text-sm">
            <i class="fas fa-plus"></i> إضافة تذكير جديد
          </button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="statsGrid">
          <div class="stat-card rounded-xl px-3 py-3 md:py-4 shadow-sm">
            <div class="flex items-center gap-3">
              <div class="stat-icon gold">
                <i class="fas fa-bell"></i>
              </div>
              <div>
                <p class="text-xs text-muted font-medium">إجمالي الإشعارات</p>
                <p
                  class="text-xl md:text-2xl font-bold text-gold"
                  id="totalNotifications"
                >
                  0
                </p>
              </div>
            </div>
          </div>
          <div class="stat-card rounded-xl px-3 py-3 md:py-4 shadow-sm">
            <div class="flex items-center gap-3">
              <div class="stat-icon warning">
                <i class="fas fa-circle"></i>
              </div>
              <div>
                <p class="text-xs text-muted font-medium">غير مقروءة</p>
                <p
                  class="text-xl md:text-2xl font-bold text-warning"
                  id="unreadNotifications"
                >
                  0
                </p>
              </div>
            </div>
          </div>
          <div class="stat-card rounded-xl px-3 py-3 md:py-4 shadow-sm">
            <div class="flex items-center gap-3">
              <div class="stat-icon emerald">
                <i class="fas fa-clock"></i>
              </div>
              <div>
                <p class="text-xs text-muted font-medium">التذكيرات</p>
                <p
                  class="text-xl md:text-2xl font-bold text-emerald"
                  id="totalReminders"
                >
                  0
                </p>
              </div>
            </div>
          </div>
          <div class="stat-card rounded-xl px-3 py-3 md:py-4 shadow-sm">
            <div class="flex items-center gap-3">
              <div class="stat-icon danger">
                <i class="fas fa-exclamation-triangle"></i>
              </div>
              <div>
                <p class="text-xs text-muted font-medium">متأخرة</p>
                <p
                  class="text-xl md:text-2xl font-bold text-danger"
                  id="overdueReminders"
                >
                  0
                </p>
              </div>
            </div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="flex flex-wrap gap-2 mb-4">
          <button
            class="tab-btn active"
            data-tab="notifications"
            onclick="switchTab('notifications')"
          >
            <i class="fas fa-bell ml-1"></i> الإشعارات
            <span
              class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full mr-1"
              id="notifBadge"
              >0</span
            >
          </button>
          <button
            class="tab-btn"
            data-tab="reminders"
            onclick="switchTab('reminders')"
          >
            <i class="fas fa-clock ml-1"></i> التذكيرات
            <span
              class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full mr-1"
              id="reminderBadge"
              >0</span
            >
          </button>
        </div>

        <!-- Notifications Tab -->
        <div id="tab-notifications" class="tab-content active">
          <div class="bg-surface rounded-2xl border border-line p-4 md:p-5">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div class="flex flex-wrap gap-2">
                <button
                  class="filter-btn active"
                  data-filter="all"
                  onclick="filterNotifications('all')"
                >
                  الكل
                </button>
                <button
                  class="filter-btn"
                  data-filter="unread"
                  onclick="filterNotifications('unread')"
                >
                  غير مقروءة
                </button>
                <button
                  class="filter-btn"
                  data-filter="read"
                  onclick="filterNotifications('read')"
                >
                  مقروءة
                </button>
              </div>
              <div class="flex flex-wrap gap-2">
                <button onclick="markAllRead()" class="btn btn-outline btn-sm">
                  تحديد الكل كمقروء
                </button>
                <button
                  onclick="clearAllNotifications()"
                  class="btn btn-danger btn-sm"
                >
                  حذف الكل
                </button>
              </div>
            </div>
            <div id="notificationsList"></div>
          </div>
        </div>

        <!-- Reminders Tab -->
        <div id="tab-reminders" class="tab-content">
          <div class="bg-surface rounded-2xl border border-line p-4 md:p-5">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div class="flex flex-wrap gap-2">
                <button
                  class="filter-btn active"
                  data-filter="all"
                  onclick="filterReminders('all')"
                >
                  الكل
                </button>
                <button
                  class="filter-btn"
                  data-filter="pending"
                  onclick="filterReminders('pending')"
                >
                  قيد الانتظار
                </button>
                <button
                  class="filter-btn"
                  data-filter="done"
                  onclick="filterReminders('done')"
                >
                  منتهية
                </button>
              </div>
              <button onclick="openAddReminder()" class="btn btn-gold btn-sm">
                <i class="fas fa-plus"></i> تذكير جديد
              </button>
            </div>
            <div id="remindersList"></div>
          </div>
        </div>
      </div>

      <!-- Modal: إضافة / تعديل تذكير -->
      <div class="modal-overlay" id="reminderModal">
        <div class="modal-box">
          <button class="modal-close" onclick="closeModal('reminderModal')">
            ✕
          </button>
          <div class="modal-title" id="reminderModalTitle">
            إضافة تذكير جديد
          </div>
          <form id="reminderForm">
            <input type="hidden" id="editReminderId" value="" />
            <div class="grid-2">
              <div class="field full-width">
                <label>العنوان *</label
                ><input
                  type="text"
                  id="remTitle"
                  required
                  placeholder="مثال: متابعة عرض ع-١٢٣"
                />
              </div>
              <div class="field">
                <label>التاريخ *</label
                ><input type="date" id="remDate" required />
              </div>
              <div class="field">
                <label>الوقت</label><input type="time" id="remTime" />
              </div>
              <div class="field full-width">
                <label>الملاحظات</label
                ><textarea
                  id="remNotes"
                  rows="3"
                  placeholder="تفاصيل التذكير..."
                ></textarea>
              </div>
            </div>
            <div
              style="
                display: flex;
                gap: 12px;
                justify-content: flex-end;
                margin-top: 20px;
                flex-wrap: wrap;
              "
