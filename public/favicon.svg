<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- الخلفية -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- خلفية دائرية -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- حلقات زخرفية -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="white" stroke-width="1.5" opacity="0.15"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>

  <!-- أيقونة الكرة الأرضية / الشبكة -->
  <g transform="translate(250, 200)" filter="url(#glow)">
    <!-- خطوط الكرة الأرضية -->
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="white" stroke-width="1.5" opacity="0.3" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="white" stroke-width="1.5" opacity="0.3" transform="rotate(-45)"/>
    <ellipse cx="0" cy="0" rx="60" ry="25" fill="none" stroke="white" stroke-width="1.8" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="25" ry="60" fill="none" stroke="white" stroke-width="1.8" opacity="0.6"/>
    
    <!-- نقاط -->
    <circle cx="0" cy="-55" r="4" fill="white"/>
    <circle cx="0" cy="55" r="4" fill="white"/>
    <circle cx="-55" cy="0" r="4" fill="white"/>
    <circle cx="55" cy="0" r="4" fill="white"/>
    
    <!-- أيقونة الرابط / السلسلة -->
    <circle cx="0" cy="0" r="18" fill="white" opacity="0.9"/>
    <path d="M-8,-8 L-4,-12 M8,8 L4,12 M-8,8 L-12,4 M8,-8 L12,-4" stroke="#764ba2" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#667eea" opacity="0.8"/>
  </g>

  <!-- نص الشقونة -->
  <text x="250" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="white" filter="url(#shadow)" letter-spacing="8">
    موقع ويب
  </text>
  
  <!-- النص الإنجليزي -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="white" opacity="0.7" letter-spacing="6">
    WEBSITE
  </text>

  <!-- خطوط زخرفية جانبية -->
  <line x1="100" y1="360" x2="400" y2="360" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="120" y1="375" x2="380" y2="375" stroke="white" stroke-width="0.5" opacity="0.2"/>
  
  <!-- مثلثات زخرفية صغيرة -->
  <polygon points="250,395 240,405 260,405" fill="white" opacity="0.2"/>
  <polygon points="230,405 235,412 225,412" fill="white" opacity="0.15"/>
  <polygon points="270,405 265,412 275,412" fill="white" opacity="0.15"/>
</svg>