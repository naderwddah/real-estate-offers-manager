<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مسار — العروض العقارية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Cairo','sans-serif'], body: ['Tajawal','sans-serif'] },
          colors: {
            bg: '#0B121E', surface: '#121B2C', surface2: '#1A2740', surface3: '#22314C',
            gold: '#C9A24B', goldSoft: '#8A7433', emerald: '#1F7A5C', emeraldSoft: '#123D30',
            terracotta: '#C1543A', terracottaSoft: '#3A1E19',
            ink: '#EDEAE2', muted: '#8B96A8', line: 'rgba(237,234,226,0.08)',
            danger: '#E05A4A'
          }
        }
      }
    }
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Tajawal',sans-serif;background:#0B121E;color:#EDEAE2;padding:24px;min-height:100vh}
    .container{max-width:1200px;margin:0 auto}
    .font-display{font-family:'Cairo',sans-serif}
    .view{display:none}
    .view.active{display:block}
    .chip{font-size:11px;padding:2px 10px;border-radius:999px;font-weight:700}
    .badge-status{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
    .badge-new{background:#C9A24B;color:#0B121E}
    .badge-waiting{background:#1F7A5C;color:#fff}
    .badge-delayed{background:#C1543A;color:#fff}
    .badge-closed{background:#1F7A5C;color:#fff}
    .btn{display:inline-block;padding:8px 20px;border-radius:10px;font-weight:700;font-size:14px;border:none;cursor:pointer;transition:all .2s}
    .btn-gold{background:#C9A24B;color:#0B121E}
    .btn-gold:hover{background:#8A7433}
    .btn-emerald{background:#1F7A5C;color:#fff}
    .btn-emerald:hover{background:#123D30}
    .btn-terracotta{background:#C1543A;color:#fff}
    .btn-terracotta:hover{background:#8A3A2A}
    .btn-outline{background:transparent;border:1px solid #22314C;color:#EDEAE2}
    .btn-outline:hover{background:#1A2740}
    .btn-sm{padding:4px 12px;font-size:12px}
    .card{background:#121B2C;border:1px solid rgba(237,234,226,0.08);border-radius:16px;padding:20px;cursor:pointer;transition:all .2s}
    .card:hover{border-color:#C9A24B55;transform:translateY(-2px)}
    .card.delayed{border-color:#C1543A;background:#1A0F0C}
    .modal-overlay{position:fixed;inset:0;background:rgba(4,8,14,0.72);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
    .modal-overlay.open{display:flex}
    .modal{background:#121B2C;border:1px solid rgba(237,234,226,0.08);border-radius:16px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;padding:32px;position:relative;margin-top:20px}
    .modal-close{position:sticky;top:0;float:left;background:transparent;border:none;color:#8B96A8;font-size:24px;cursor:pointer;z-index:10}
    .modal-close:hover{color:#EDEAE2}
    .modal-title{font-size:24px;font-weight:800;font-family:'Cairo',sans-serif;margin-bottom:24px}
    .switch-group{display:flex;gap:12px;background:#0F1830;border-radius:12px;padding:4px;margin-bottom:24px;border:1px solid #22314C}
    .switch-group button{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#8B96A8;font-weight:700;cursor:pointer;transition:all .2s}
    .switch-group button.active{background:#C9A24B;color:#0B121E}
    .field{display:flex;flex-direction:column;gap:4px}
    .field label{font-size:12px;color:#8B96A8;font-weight:700}
    .field input,.field textarea,.field select{background:#0F1830;border:1px solid #22314C;border-radius:8px;padding:8px 12px;color:#EDEAE2;font-size:14px;width:100%}
    .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #C9A24B55}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .full-width{grid-column:1/-1}
    .file-upload-area{border:2px dashed #22314C;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
    .file-upload-area:hover{border-color:#C9A24B;background:rgba(201,162,75,0.05)}
    .doc-item{background:#0F1830;border:1px solid #22314C;border-radius:6px;padding:4px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;margin:4px}
    .doc-item .del{cursor:pointer;color:#C1543A}
    .doc-item .del:hover{color:#E05A4A}
    .timeline{display:flex;flex-direction:column;gap:0}
    .timeline-item{display:flex;gap:16px;padding:6px 0}
    .timeline-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:2px solid #0B121E;margin-top:4px}
    .timeline-dot.completed{background:#C9A24B}
    .timeline-dot.active{background:#C9A24B;box-shadow:0 0 0 4px rgba(201,162,75,0.3)}
    .timeline-dot.delayed{background:#C1543A}
    .timeline-dot.pending{background:#22314C}
    .timeline-line{width:2px;flex:1;min-height:20px;margin:0 7px}
    .timeline-line.completed{background:linear-gradient(180deg,#C9A24B 0%,#C9A24B 100%)}
    .timeline-line.pending{background:#22314C}
    .timeline-line.delayed{background:#C1543A}
    .timeline-content{flex:1}
    .timeline-content .stage-name{font-weight:700;font-size:15px}
    .timeline-content .stage-date{font-size:12px;color:#8B96A8}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1A2740;border:1px solid rgba(237,234,226,0.08);border-radius:12px;padding:12px 24px;font-weight:700;z-index:200;display:none}
    .toast.show{display:block;animation:fadeIn .3s}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .hidden{display:none!important}
    .text-ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:768px){.grid-2{grid-template-columns:1fr};.modal{padding:20px}}
    .section{background:#121B2C;border:1px solid rgba(237,234,226,0.08);border-radius:16px;padding:24px;margin-bottom:24px}
    .section-title{font-size:18px;font-weight:800;margin-bottom:16px;font-family:'Cairo',sans-serif}
    .offer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .progress-bar{width:100%;background:#22314C;border-radius:999px;height:4px;overflow:hidden;margin:8px 0}
    .progress-bar .fill{height:100%;background:#C9A24B;border-radius:999px;transition:width .3s}
    .empty-state{text-align:center;padding:60px 20px}
    .empty-state .icon{font-size:64px;margin-bottom:16px}
    .empty-state h3{font-size:24px;font-weight:800;font-family:'Cairo',sans-serif}
    .empty-state p{color:#8B96A8;margin-top:8px}
    .actions-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
    .detail-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
    .detail-title{font-size:28px;font-weight:800;font-family:'Cairo',sans-serif}
    .detail-meta{display:flex;gap:16px;font-size:14px;color:#8B96A8;flex-wrap:wrap;align-items:center}
    .smart-area textarea{width:100%;height:200px;background:#0F1830;border:1px solid #22314C;border-radius:8px;padding:12px;color:#EDEAE2;font-size:14px;resize:vertical}
    .smart-area textarea:focus{outline:2px solid #C9A24B55}
    .smart-actions{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}
  </style>
</head>
<body>

<div class="container">

<!-- ========== HEADER ========== -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
  <h1 class="font-display text-2xl font-900">📋 العروض العقارية</h1>
  <button class="btn btn-gold" onclick="openAddModal()">+ عرض جديد</button>
</div>

<!-- ========== OFFERS LIST VIEW ========== -->
<div id="offersListView" class="view active">
  <div id="offersGrid" class="offer-grid"></div>
  <div id="emptyState" class="empty-state">
    <div class="icon">🏗️</div>
    <h3>لا توجد عروض بعد</h3>
    <p>ابدأ بإضافة أول عرض عقاري</p>
    <button class="btn btn-gold" style="margin-top:16px" onclick="openAddModal()">➕ إضافة عرض</button>
  </div>
</div>

<!-- ========== OFFER DETAIL VIEW ========== -->
<div id="offerDetailView" class="view">
  <button class="btn btn-outline btn-sm" onclick="showListView()" style="margin-bottom:16px">← رجوع للقائمة</button>
  <div id="offerDetailContent"></div>
</div>

<!-- ========== MODAL ========== -->
<div id="offerModal" class="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">عرض جديد</div>

    <div class="switch-group">
      <button class="active" data-mode="normal" onclick="setMode('normal')">إدخال عادي</button>
      <button data-mode="smart" onclick="setMode('smart')">إدخال ذكي</button>
    </div>

    <div id="smartArea" class="smart-area hidden">
      <label style="font-weight:700;display:block;margin-bottom:8px">الصق رسالة العميل مع الأجوبة بين [ ]</label>
      <textarea id="smartInput" placeholder="السلام عليكم،

فضلاً اكتب الإجابة داخل [ ] فقط، ولا تعدل الأسئلة.

🏠 نوع العقار: [فيلا]
📋 نوع الطلب: [شراء]
🏙️ المدينة: [الرياض]
📍 الحي المطلوب: [الياسمين]
📐 المساحة المطلوبة: [450]
💰 الميزانية: [2500000]
📋 المواصفات: [مسبح, حديقة]
👤 الاسم: [أحمد]
📞 رقم التواصل: [0501234567]
📝 ملاحظات: [تريد تشطيب فاخر]"></textarea>
      <div class="smart-actions">
        <button class="btn btn-gold" onclick="parseSmartInput()">🔍 استخراج البيانات</button>
        <button class="btn btn-outline" onclick="document.getElementById('smartInput').value='';document.getElementById('smartFeedback').textContent=''">مسح</button>
      </div>
      <div id="smartFeedback" style="margin-top:8px;font-size:14px;color:#8B96A8"></div>
    </div>

    <form id="offerForm" class="grid-2" style="margin-top:16px">
      <input type="hidden" id="editOfferId" value="">

      <div class="field"><label>نوع العقار *</label><input type="text" id="f_type" required placeholder="فيلا"></div>
      <div class="field"><label>نوع الاتفاق *</label>
        <select id="f_dealType" required>
          <option value="بيع">بيع</option><option value="إيجار">إيجار</option>
          <option value="استثمار">استثمار</option><option value="مشاركة أرباح">مشاركة أرباح</option>
          <option value="فرنشايز">فرنشايز</option>
        </select>
      </div>
      <div class="field"><label>مسار العرض *</label>
        <select id="f_track" required>
          <option value="company">أعمال الشركة</option>
          <option value="personal">عمل شخصي</option>
        </select>
      </div>
      <div class="field"><label>المدينة *</label><input type="text" id="f_city" required placeholder="الرياض"></div>
      <div class="field"><label>الحي *</label><input type="text" id="f_district" required placeholder="الياسمين"></div>
      <div class="field"><label>العنوان التفصيلي</label><input type="text" id="f_address" placeholder="شارع الأمير سلطان"></div>
      <div class="field"><label>المساحة (م²) *</label><input type="number" id="f_area" required placeholder="450"></div>
      <div class="field"><label>السعر (ريال) *</label><input type="number" id="f_price" required placeholder="2500000"></div>
      <div class="field"><label>الغرض</label><input type="text" id="f_purpose" placeholder="للبيع - فرصة استثمارية"></div>
      <div class="field full-width"><label>الوصف</label><textarea id="f_description" rows="2" placeholder="وصف تفصيلي للعقار"></textarea></div>
      <div class="field full-width"><label>رابط الخريطة</label><input type="url" id="f_mapLink" placeholder="https://maps.google.com/..."></div>
      <div class="field full-width"><label>مقدّم العرض (مالك / وسيط)</label>
        <select id="f_contactId"></select>
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:8px" onclick="addContactInline()">+ إضافة جهة اتصال جديدة</button>
      </div>
      <div class="field full-width"><label>صور العقار</label>
        <div class="file-upload-area" onclick="document.getElementById('f_images').click()">📎 اضغط لرفع صور</div>
        <input type="file" id="f_images" accept="image/*" multiple style="display:none">
      </div>
      <div class="field full-width"><label>المخطط (PDF/صورة)</label>
        <div class="file-upload-area" onclick="document.getElementById('f_plan').click()">📎 اضغط لرفع المخطط</div>
        <input type="file" id="f_plan" accept=".pdf,image/*" style="display:none">
      </div>
    </form>

    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px">
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-gold" onclick="saveOffer()">💾 حفظ العرض</button>
    </div>
  </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast" class="toast"></div>
</div>

<script>
// ============================================================
// DATA (تخزن في LocalStorage)
// ============================================================
let DB = {
  offers: [],
  contacts: [],
  nextId: 1
};

const STAGES_COMPANY = [
  { id: 1, name: 'عرض جديد' },
  { id: 2, name: 'تم إرساله للمدير' },
  { id: 3, name: 'تم تحديد السعر' },
  { id: 4, name: 'تم إبلاغ المالك' },
  { id: 5, name: 'تم استلام المستندات' },
  { id: 6, name: 'عند الشؤون القانونية' },
  { id: 7, name: 'مكتمل ✅' }
];
const STAGES_PERSONAL = [
  { id: 1, name: 'عرض جديد' },
  { id: 2, name: 'تفاوض' },
  { id: 3, name: 'تم الاتفاق' },
  { id: 4, name: 'مكتمل ✅' }
];

// ============================================================
// LOAD / SAVE
// ============================================================
function loadDB() {
  const saved = localStorage.getItem('masarOffersDB');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      DB = parsed;
      if (!DB.contacts) DB.contacts = [];
      if (!DB.offers) DB.offers = [];
      if (!DB.nextId) DB.nextId = 1;
      return true;
    } catch (e) {}
  }
  // Default data (empty)
  DB.offers = [];
  DB.contacts = [
    { id: 1, name: 'خالد السبيعي', type: 'مالك', phone: '0501234567' },
    { id: 2, name: 'شركة البناء الذهبي', type: 'وسيط', phone: '0559876543' }
  ];
  DB.nextId = 1;
  saveDB();
  return false;
}

function saveDB() {
  localStorage.setItem('masarOffersDB', JSON.stringify(DB));
}

function getStages(track) {
  return track === 'company' ? STAGES_COMPANY : STAGES_PERSONAL;
}

function getStatusName(status, track) {
  const stages = getStages(track);
  const s = stages.find(s => s.id === status);
  return s ? s.name : 'غير معروف';
}

function getStatusBadge(status, track) {
  const name = getStatusName(status, track);
  let cls = 'badge-status ';
  if (status === 1) cls += 'badge-new';
  else if (status === 2 || status === 4 || status === 6) cls += 'badge-waiting';
  else if (status === 7 || (status === 3 && track === 'personal')) cls += 'badge-closed';
  else cls += 'badge-delayed';
  return `<span class="${cls}">${name}</span>`;
}

function getContact(id) {
  return DB.contacts.find(c => c.id === id);
}

function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function fmtMoney(n) {
  return n ? Number(n).toLocaleString('en-US') + ' ريال' : '—';
}

// ============================================================
// TOAST
// ============================================================
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ============================================================
// VIEWS
// ============================================================
function showListView() {
  document.getElementById('offersListView').classList.add('active');
  document.getElementById('offerDetailView').classList.remove('active');
  renderOffers();
}

function showDetailView(offerId) {
  document.getElementById('offersListView').classList.remove('active');
  document.getElementById('offerDetailView').classList.add('active');
  renderOfferDetail(offerId);
}

// ============================================================
// RENDER OFFERS LIST
// ============================================================
function renderOffers() {
  const grid = document.getElementById('offersGrid');
  const empty = document.getElementById('emptyState');

  if (DB.offers.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = DB.offers.map(o => {
    const stages = getStages(o.track);
    const pct = Math.round((o.status / stages.length) * 100);
    const isDelayed = o.status > 1 && o.status < stages.length && daysBetween(o.statusDate, new Date().toISOString().slice(0,10)) >= 3;
    const contact = getContact(o.contactId);
    const cardCls = isDelayed ? 'card delayed' : 'card';
    return `
      <div class="${cardCls}" onclick="showDetailView('${o.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div>
            <div style="font-weight:800;font-size:16px;font-family:'Cairo',sans-serif">${o.title || o.type + ' - ' + o.district}</div>
            <div style="font-size:13px;color:#8B96A8">${o.city} - ${o.district}</div>
          </div>
          <span class="chip" style="${o.track === 'company' ? 'background:#123D30;color:#1F7A5C' : 'background:#1A2740;color:#8B96A8'}">${o.track === 'company' ? 'شركة' : 'شخصي'}</span>
        </div>
        <div style="font-size:14px;margin-bottom:6px">${o.dealType} · ${o.area} م² · ${fmtMoney(o.price)}</div>
        <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#8B96A8;margin-top:4px">
          <span>${getStatusName(o.status, o.track)}</span>
          ${isDelayed ? '<span style="color:#E05A4A">⏰ متأخر</span>' : ''}
        </div>
        <div style="font-size:12px;color:#8B96A8;margin-top:8px;border-top:1px solid rgba(237,234,226,0.05);padding-top:8px">
          ${contact ? contact.name : 'بدون مقدم'}
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// RENDER OFFER DETAIL
// ============================================================
function renderOfferDetail(offerId) {
  const o = DB.offers.find(x => x.id === offerId);
  if (!o) {
    document.getElementById('offerDetailContent').innerHTML = '<div style="color:#8B96A8;text-align:center;padding:40px">العرض غير موجود</div>';
    return;
  }

  const contact = getContact(o.contactId);
  const stages = getStages(o.track);
  const statusName = getStatusName(o.status, o.track);
  const isDelayed = o.status > 1 && o.status < stages.length && daysBetween(o.statusDate, new Date().toISOString().slice(0,10)) >= 3;

  let statusBadgeCls = 'badge-status ';
  if (o.status === 1) statusBadgeCls += 'badge-new';
  else if (o.status === 2 || o.status === 4 || o.status === 6) statusBadgeCls += 'badge-waiting';
  else if (o.status === 7 || (o.status === 3 && o.track === 'personal')) statusBadgeCls += 'badge-closed';
  else statusBadgeCls += 'badge-delayed';

  // Timeline
  let timelineHtml = stages.map((s, idx) => {
    const isCompleted = idx < o.status;
    const isActive = idx === o.status - 1;
    const isDelayedStage = isActive && isDelayed;
    let dotClass = 'pending';
    if (isCompleted) dotClass = 'completed';
    else if (isActive) dotClass = isDelayedStage ? 'delayed' : 'active';
    let lineClass = 'pending';
    if (idx < o.status - 1) lineClass = 'completed';
    else if (idx === o.status - 1 && isDelayedStage) lineClass = 'delayed';
    return `
      <div class="timeline-item">
        <div style="display:flex;flex-direction:column;align-items:center;padding-top:4px">
          <div class="timeline-dot ${dotClass}"></div>
          ${idx < stages.length - 1 ? `<div class="timeline-line ${lineClass}"></div>` : ''}
        </div>
        <div class="timeline-content">
          <div class="stage-name">${s.name}</div>
          ${idx === o.status - 1 ? `<div class="stage-date">آخر تحديث: ${o.statusDate}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  // Action buttons
  let actionsHtml = '';
  if (o.status < stages.length) {
    if (o.status === 1) {
      actionsHtml += `<button class="btn btn-gold" onclick="offerAction('${o.id}','sendToManager')">📤 إرسال للمدير</button>`;
    } else if (o.status === 2) {
      actionsHtml += `<button class="btn btn-gold" onclick="offerAction('${o.id}','recordPrice')">💰 تسجيل السعر المعتمد</button>`;
    } else if (o.status === 3) {
      actionsHtml += `<button class="btn btn-gold" onclick="offerAction('${o.id}','sendToOwner')">📤 إبلاغ المالك</button>`;
    } else if (o.status === 4) {
      actionsHtml += `<button class="btn btn-gold" onclick="offerAction('${o.id}','confirmDocs')">📤 تأكيد استلام المستندات</button>`;
    } else if (o.status === 5) {
      actionsHtml += `<button class="btn btn-gold" onclick="offerAction('${o.id}','sendToLegal')">📤 إرسال للشؤون القانونية</button>`;
    } else if (o.status === 6) {
      actionsHtml += `<button class="btn btn-gold" onclick="offerAction('${o.id}','closeDeal')">✅ تسجيل توقيع العقد</button>`;
    }
  } else {
    actionsHtml = `<span style="color:#1F7A5C;font-weight:700">✅ الصفقة مكتملة</span>`;
  }

  // Documents
  let docsHtml = '';
  const docNames = Object.keys(o.documents || {});
  if (docNames.length) {
    docsHtml = docNames.map(d => `
      <span class="doc-item">
        ${d} ${o.documents[d] ? '✅' : '⏳'}
        <span class="del" onclick="toggleDoc('${o.id}','${d}')">✕</span>
      </span>
    `).join('');
  } else {
    docsHtml = '<span style="color:#8B96A8">لا توجد مستندات</span>';
  }

  // Log
  let logHtml = (o.log || []).map(l => `<div>• ${l}</div>`).join('') || '<div style="color:#8B96A8">لا توجد سجلات</div>';

  const html = `
    <div class="detail-header">
      <div>
        <div class="detail-title">${o.title || o.type + ' - ' + o.district}</div>
        <div class="detail-meta">
          <span>#${o.refNumber || 'A-' + String(o.id).padStart(4,'0')}</span>
          <span>${o.type}</span>
          <span>${o.dealType}</span>
          <span class="chip" style="${o.track === 'company' ? 'background:#123D30;color:#1F7A5C' : 'background:#1A2740;color:#8B96A8'}">${o.track === 'company' ? 'شركة' : 'شخصي'}</span>
          <span class="${statusBadgeCls}">${statusName}</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-gold btn-sm" onclick="openEditModal('${o.id}')">✏️ تعديل</button>
      </div>
    </div>

    ${isDelayed ? `<div style="background:#3A1A14;border:1px solid #C1543A;border-radius:12px;padding:12px;margin:16px 0;color:#E05A4A;font-weight:700">⏰ هذا العرض متأخر في المرحلة الحالية</div>` : ''}

    <div class="section">
      <div class="grid-2">
        <div class="field"><label>المدينة</label><div class="value" style="font-size:15px">${o.city}</div></div>
        <div class="field"><label>الحي</label><div class="value" style="font-size:15px">${o.district}</div></div>
        <div class="field"><label>العنوان التفصيلي</label><div class="value" style="font-size:15px">${o.address || '-'}</div></div>
        <div class="field"><label>المساحة</label><div class="value" style="font-size:15px">${o.area} م²</div></div>
        <div class="field"><label>السعر</label><div class="value" style="font-size:15px;color:#C9A24B;font-weight:700">${fmtMoney(o.price)}</div></div>
        <div class="field"><label>الغرض</label><div class="value" style="font-size:15px">${o.purpose || '-'}</div></div>
      </div>
      <div class="field" style="margin-top:12px"><label>الوصف</label><div class="value" style="font-size:15px">${o.description || '-'}</div></div>
      <div class="field" style="margin-top:12px"><label>رابط الخريطة</label><a href="${o.mapLink || '#'}" target="_blank" style="color:#C9A24B;text-decoration:none">${o.mapLink || '-'}</a></div>
      <div class="field" style="margin-top:12px"><label>مقدّم العرض</label><div style="font-weight:700;font-size:15px">${contact ? contact.name + ' (' + contact.type + ') - ' + contact.phone : 'غير معروف'}</div></div>
    </div>

    <div class="section">
      <div class="section-title">مسار الصفقة</div>
      <div class="timeline">${timelineHtml}</div>
      <div class="actions-row">${actionsHtml}</div>
    </div>

    <div class="section">
      <div class="section-title">المستندات</div>
      <div>${docsHtml}</div>
      <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="addDocument('${o.id}')">+ إضافة مستند</button>
    </div>

    <div class="section">
      <div class="section-title">سجل النشاط</div>
      <div style="font-size:14px;color:#8B96A8">${logHtml}</div>
    </div>
  `;

  document.getElementById('offerDetailContent').innerHTML = html;
}

// ============================================================
// OFFER ACTIONS
// ============================================================
function offerAction(offerId, action) {
  const o = DB.offers.find(x => x.id === offerId);
  if (!o) { toast('العرض غير موجود'); return; }
  const stages = getStages(o.track);
  if (o.status >= stages.length) { toast('الصفقة مكتملة'); return; }

  // Simulate action
  const actionsMap = {
    'sendToManager': { status: 2, msg: 'تم إرسال العرض للمدير' },
    'recordPrice': { status: 3, msg: 'تم تحديد السعر المعتمد' },
    'sendToOwner': { status: 4, msg: 'تم إبلاغ المالك' },
    'confirmDocs': { status: 5, msg: 'تم تأكيد استلام المستندات' },
    'sendToLegal': { status: 6, msg: 'تم إرسال المستندات للشؤون القانونية' },
    'closeDeal': { status: 7, msg: '✅ تم توقيع العقد وإتمام الصفقة' }
  };

  const map = actionsMap[action];
  if (!map) { toast('إجراء غير معروف'); return; }

  // Special: recordPrice needs extra input
  if (action === 'recordPrice') {
    const price = prompt('أدخل السعر المعتمد من المدير (ريال):', o.price || '');
    if (!price || Number(price) <= 0) { toast('الرجاء إدخال سعر صحيح'); return; }
    o.price = Number(price);
  }

  // For send actions, simulate WhatsApp opening
  if (['sendToManager', 'sendToOwner', 'sendToLegal'].includes(action)) {
    const contact = action === 'sendToManager' ? { name: 'المدير', phone: '966500000000' } :
                    action === 'sendToLegal' ? { name: 'الشؤون القانونية', phone: '966500000000' } :
                    getContact(o.contactId);
    if (contact) {
      const msg = `عرض عقاري: ${o.title || o.type}\nالموقع: ${o.city} - ${o.district}\nالمساحة: ${o.area} م²\nالسعر: ${fmtMoney(o.price)}`;
      window.open(`https://wa.me/${contact.phone}?text=${encodeURIComponent(msg)}`, '_blank');
      toast('📱 تم فتح واتساب، أرسل الرسالة ثم عد للتأكيد');
    }
    // Ask for confirmation after sending
    setTimeout(() => {
      if (confirm('هل تم إرسال الرسالة فعلاً؟')) {
        o.status = map.status;
        o.statusDate = new Date().toISOString().slice(0,10);
        if (!o.log) o.log = [];
        o.log.push(`${map.msg} في ${o.statusDate}`);
        saveDB();
        renderOfferDetail(offerId);
        renderOffers();
        toast('✅ تم تأكيد الإرسال');
      }
    }, 1000);
    return;
  }

  // Direct actions
  o.status = map.status;
  o.statusDate = new Date().toISOString().slice(0,10);
  if (!o.log) o.log = [];
  o.log.push(`${map.msg} في ${o.statusDate}`);
  saveDB();
  renderOfferDetail(offerId);
  renderOffers();
  toast(`✅ ${map.msg}`);
}

function toggleDoc(offerId, docName) {
  const o = DB.offers.find(x => x.id === offerId);
  if (!o) return;
  if (!o.documents) o.documents = {};
  o.documents[docName] = !o.documents[docName];
  saveDB();
  renderOfferDetail(offerId);
}

function addDocument(offerId) {
  const name = prompt('اسم المستند:');
  if (!name) return;
  const o = DB.offers.find(x => x.id === offerId);
  if (!o) return;
  if (!o.documents) o.documents = {};
  o.documents[name] = false;
  saveDB();
  renderOfferDetail(offerId);
}

// ============================================================
// MODAL
// ============================================================
let currentMode = 'normal';
let editingOfferId = null;

function openAddModal() {
  editingOfferId = null;
  document.getElementById('modalTitle').textContent = 'عرض جديد';
  document.getElementById('editOfferId').value = '';
  document.getElementById('offerForm').reset();
  document.getElementById('f_type').value = '';
  document.getElementById('f_city').value = '';
  document.getElementById('f_district').value = '';
  document.getElementById('f_area').value = '';
  document.getElementById('f_price').value = '';
  document.getElementById('f_purpose').value = '';
  document.getElementById('f_description').value = '';
  document.getElementById('f_mapLink').value = '';
  document.getElementById('f_dealType').value = 'بيع';
  document.getElementById('f_track').value = 'company';
  populateContactSelect();
  setMode('normal');
  document.getElementById('smartInput').value = '';
  document.getElementById('smartFeedback').textContent = '';
  document.getElementById('offerModal').classList.add('open');
}

function openEditModal(offerId) {
  const o = DB.offers.find(x => x.id === offerId);
  if (!o) { toast('العرض غير موجود'); return; }
  editingOfferId = offerId;
  document.getElementById('modalTitle').textContent = 'تعديل العرض';
  document.getElementById('editOfferId').value = offerId;
  document.getElementById('f_type').value = o.type || '';
  document.getElementById('f_dealType').value = o.dealType || 'بيع';
  document.getElementById('f_track').value = o.track || 'company';
  document.getElementById('f_city').value = o.city || '';
  document.getElementById('f_district').value = o.district || '';
  document.getElementById('f_address').value = o.address || '';
  document.getElementById('f_area').value = o.area || '';
  document.getElementById('f_price').value = o.price || '';
  document.getElementById('f_purpose').value = o.purpose || '';
  document.getElementById('f_description').value = o.description || '';
  document.getElementById('f_mapLink').value = o.mapLink || '';
  populateContactSelect(o.contactId);
  setMode('normal');
  document.getElementById('offerModal').classList.add('open');
}

function closeModal() {
  document.getElementById('offerModal').classList.remove('open');
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.switch-group button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.switch-group button[data-mode="${mode}"]`).classList.add('active');
  document.getElementById('smartArea').classList.toggle('hidden', mode !== 'smart');
  document.getElementById('offerForm').style.display = mode === 'normal' ? 'grid' : 'none';
}

function populateContactSelect(selectedId) {
  const sel = document.getElementById('f_contactId');
  sel.innerHTML = DB.contacts.map(c => `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name} (${c.type}) - ${c.phone}</option>`).join('');
  if (DB.contacts.length === 0) {
    sel.innerHTML = '<option value="">لا توجد جهات اتصال</option>';
  }
}

function addContactInline() {
  const name = prompt('اسم جهة الاتصال:');
  if (!name) return;
  const phone = prompt('رقم الجوال:');
  if (!phone) return;
  const type = prompt('الصفة (مالك/وسيط/عميل طالب):') || 'مالك';
  const newContact = { id: DB.contacts.length > 0 ? Math.max(...DB.contacts.map(c => c.id)) + 1 : 1, name, type, phone };
  DB.contacts.push(newContact);
  saveDB();
  populateContactSelect(newContact.id);
  toast('✅ تم إضافة جهة الاتصال');
}

// ============================================================
// SAVE OFFER (Add or Update)
// ============================================================
function saveOffer() {
  const editId = document.getElementById('editOfferId').value;
  const type = document.getElementById('f_type').value.trim();
  const dealType = document.getElementById('f_dealType').value;
  const track = document.getElementById('f_track').value;
  const city = document.getElementById('f_city').value.trim();
  const district = document.getElementById('f_district').value.trim();
  const address = document.getElementById('f_address').value.trim();
  const area = parseFloat(document.getElementById('f_area').value);
  const price = parseFloat(document.getElementById('f_price').value);
  const purpose = document.getElementById('f_purpose').value.trim();
  const description = document.getElementById('f_description').value.trim();
  const mapLink = document.getElementById('f_mapLink').value.trim();
  const contactId = parseInt(document.getElementById('f_contactId').value);

  if (!type || !city || !district || !area || !price || isNaN(area) || isNaN(price) || !contactId) {
    toast('الرجاء ملء جميع الحقول المطلوبة (*)');
    return;
  }

  const now = new Date().toISOString().slice(0,10);

  if (editId) {
    // Update existing
    const o = DB.offers.find(x => x.id === editId);
    if (!o) { toast('العرض غير موجود'); return; }
    o.type = type;
    o.dealType = dealType;
    o.track = track;
    o.city = city;
    o.district = district;
    o.address = address;
    o.area = area;
    o.price = price;
    o.purpose = purpose;
    o.description = description;
    o.mapLink = mapLink;
    o.contactId = contactId;
    if (!o.log) o.log = [];
    o.log.push(`تم تعديل العرض في ${now}`);
    saveDB();
    closeModal();
    renderOfferDetail(editId);
    renderOffers();
    toast('✅ تم تحديث العرض بنجاح');
  } else {
    // Add new
    const newOffer = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      title: type + ' في ' + district,
      type: type,
      dealType: dealType,
      track: track,
      city: city,
      district: district,
      address: address,
      area: area,
      price: price,
      purpose: purpose,
      description: description,
      mapLink: mapLink || 'https://maps.google.com',
      contactId: contactId,
      status: 1,
      statusDate: now,
      documents: {},
      log: [`تم استلام العرض في ${now}`],
      images: [],
      plan: null,
      refNumber: 'A-' + String(DB.offers.length + 1).padStart(4,'0')
    };
    DB.offers.push(newOffer);
    saveDB();
    closeModal();
    renderOffers();
    toast('✅ تم إضافة العرض بنجاح');
    showDetailView(newOffer.id);
  }
}

// ============================================================
// SMART INPUT
// ============================================================
function parseSmartInput() {
  const text = document.getElementById('smartInput').value;
  const pattern = /\[([^\]]*)\]/g;
  const matches = [...text.matchAll(pattern)];
  const values = matches.map(m => m[1].trim());

  if (values.length === 0) {
    document.getElementById('smartFeedback').textContent = '⚠️ لم يتم العثور على أي إجابة بين قوسين []';
    document.getElementById('smartFeedback').style.color = '#E05A4A';
    return;
  }

  const fields = ['type', 'dealType', 'city', 'district', 'area', 'price', 'features', 'name', 'phone', 'notes'];
  let data = {};
  for (let i = 0; i < Math.min(fields.length, values.length); i++) {
    data[fields[i]] = values[i];
  }

  document.getElementById('f_type').value = data.type || '';
  let deal = data.dealType || '';
  if (deal.includes('شراء')) deal = 'بيع';
  else if (deal.includes('استئجار')) deal = 'إيجار';
  document.getElementById('f_dealType').value = deal || 'بيع';
  document.getElementById('f_city').value = data.city || '';
  document.getElementById('f_district').value = data.district || '';
  document.getElementById('f_area').value = data.area || '';
  document.getElementById('f_price').value = data.price || '';
  document.getElementById('f_purpose').value = data.notes || '';

  const name = data.name || '';
  const phone = data.phone || '';
  if (name && phone) {
    let existing = DB.contacts.find(c => c.name === name && c.phone === phone);
    if (!existing) {
      const newId = DB.contacts.length > 0 ? Math.max(...DB.contacts.map(c => c.id)) + 1 : 1;
      existing = { id: newId, name, type: 'عميل', phone };
      DB.contacts.push(existing);
      saveDB();
    }
    populateContactSelect(existing.id);
  }

  document.getElementById('smartFeedback').textContent = `✅ تم استخراج ${values.length} قيمة، راجع الحقول أدناه`;
  document.getElementById('smartFeedback').style.color = '#1F7A5C';
  setMode('normal');
  toast('تم ملء الحقول تلقائياً، راجعها وأكمل الناقص');
}

// ============================================================
// INIT
// ============================================================
loadDB();
renderOffers();

// Expose for inline onclick
window.showListView = showListView;
window.showDetailView = showDetailView;
window.openAddModal = openAddModal;
window.openEditModal = openEditModal;
window.closeModal = closeModal;
window.setMode = setMode;
window.saveOffer = saveOffer;
window.offerAction = offerAction;
window.toggleDoc = toggleDoc;
window.addDocument = addDocument;
window.addContactInline = addContactInline;
window.parseSmartInput = parseSmartInput;
window.toast = toast;
window.renderOffers = renderOffers;
</script>
</body>
</html>
