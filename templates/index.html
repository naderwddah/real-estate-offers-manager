<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة إدارة عقارات حراج</title>

    <!-- Tailwind CSS لتصميم عصري وسريع -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ملفات الستايل (CSS) الخاصة بـ DataTables -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css"
    />

    <!-- 1. مكتبة jQuery الأساسية -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- 2. مكتبة DataTables الأساسية (تم تصحيح الامتداد إلى .js هنا) -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>

    <!-- 3. مكتبات تصدير الإكسل (يجب أن يتم تحميلها بعد DataTables) -->
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f3f4f6;
      }
      table.dataTable tbody tr {
        background-color: #ffffff;
      }
      .dt-buttons .dt-button {
        background-color: #10b981 !important;
        color: white !important;
        border-radius: 8px !important;
        border: none !important;
        padding: 8px 16px !important;
        font-weight: bold !important;
        margin-bottom: 15px !important;
      }
      .dt-buttons .dt-button:hover {
        background-color: #059669 !important;
      }
    </style>
  </head>
  <body class="p-8">
    <div class="max-w-7xl mx-auto bg-white p-6 rounded-xl shadow-lg">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h1 class="text-3xl font-bold text-gray-800">
          🏠 أحدث إعلانات حراج العقارية
        </h1>
        <button
          id="refreshBtn"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow-md"
        >
          🔄 تحديث البيانات الآن
        </button>
      </div>

      <div
        id="loading"
        class="text-center py-10 text-xl font-bold text-gray-500"
      >
        ⏳ جاري سحب البيانات بسرعة من حراج...
      </div>

      <div id="tableContainer" style="display: none">
        <table id="adsTable" class="display w-full">
          <thead>
            <tr>
              <th>رقم الإعلان</th>
              <th>العنوان</th>
              <th>السعر</th>
              <th>المدينة</th>
              <th>المعلن</th>
              <th>الوصف (مختصر)</th>
              <th>الرابط</th>
            </tr>
          </thead>
          <tbody>
            <!-- سيتم تعبئة البيانات هنا برمجياً -->
          </tbody>
        </table>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        let table;

        function loadData() {
          $("#loading").show();
          $("#tableContainer").hide();

          // إذا كان الجدول موجوداً مسبقاً، قم بتدميره لإعادة بنائه
          if ($.fn.DataTable.isDataTable("#adsTable")) {
            $("#adsTable").DataTable().destroy();
          }

          $.ajax({
            url: "/api/ads",
            method: "GET",
            success: function (data) {
              $("#loading").hide();
              $("#tableContainer").show();

              table = $("#adsTable").DataTable({
                data: data,
                columns: [
                  { data: "id" },
                  { data: "title" },
                  { data: "price" },
                  { data: "city" },
                  { data: "author" },
                  { data: "description" },
                  {
                    data: "link",
                    render: function (data, type, row) {
                      return `<a href="${data}" target="_blank" class="text-blue-500 hover:underline font-bold">عرض الإعلان</a>`;
                    },
                  },
                ],
                // تم حل مشكلة CORS بوضع الترجمة مباشرة هنا
                language: {
                  emptyTable: "ليست هناك بيانات متاحة في الجدول",
                  loadingRecords: "جاري التحميل...",
                  processing: "جاري المعالجة...",
                  lengthMenu: "أظهر _MENU_ مدخلات",
                  zeroRecords: "لم يعثر على أية سجلات",
                  info: "إظهار _START_ إلى _END_ من أصل _TOTAL_ مدخل",
                  infoEmpty: "يعرض 0 إلى 0 من أصل 0 سجل",
                  infoFiltered: "(منتقاة من مجموع _MAX_ مُدخل)",
                  search: "ابحث في الإعلانات:",
                  paginate: {
                    first: "الأول",
                    previous: "السابق",
                    next: "التالي",
                    last: "الأخير",
                  },
                },
                dom: "Bfrtip",
                buttons: [
                  {
                    extend: "excelHtml5",
                    text: "📥 تصدير إلى إكسل (Excel)",
                    title: "إعلانات العقار - حراج",
                    className: "dt-button",
                  },
                ],
                pageLength: 25,
                order: [[0, "desc"]], // ترتيب تنازلي بناءً على رقم الإعلان
              });
            },
            error: function () {
              $("#loading").html(
                '<span class="text-red-500">❌ حدث خطأ أثناء الاتصال بالخادم. تأكد من تشغيل ملف app.py</span>',
              );
            },
          });
        }

        // تحميل البيانات عند فتح الصفحة
        loadData();

        // زر تحديث البيانات
        $("#refreshBtn").click(function () {
          loadData();
        });
      });
    </script>
  </body>
</html>
